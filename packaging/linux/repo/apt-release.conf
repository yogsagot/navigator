// Fields for the Release stanza that apt-ftparchive generates.
//
// Deliberately no Valid-Until: an expiry that nobody remembers to refresh
// turns every user's `apt update' into a hard error on a date chosen years
// earlier.  The cost is that a stale mirror cannot be detected by age alone;
// if that ever matters, set an expiry a year out AND add a scheduled job that
// re-signs before it lapses.  One without the other is worse than neither.
APT::FTPArchive::Release::Origin       "navigator-fm";
APT::FTPArchive::Release::Label        "Navigator";
APT::FTPArchive::Release::Suite        "stable";
APT::FTPArchive::Release::Codename     "stable";
APT::FTPArchive::Release::Architectures "all amd64 arm64";
APT::FTPArchive::Release::Components   "main";
APT::FTPArchive::Release::Description  "Navigator -- DOS Navigator for POSIX terminals";
