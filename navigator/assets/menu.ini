# F2's user menu.  Options > Global menu definition edits this file; a
# .navigator-menu.ini in a directory (or one above it) is used there instead,
# and F2 in the menu switches between the two, F4 edits the one shown.
#
# `Caption = command' is an item, indented lines under it more commands.
# [Name] starts a submenu, [Name/Inner] one inside it, [/] goes back to the
# top; a line of `-' is a separator.  ~X~ marks an item's letter, and a
# caption starting `F5 ' is chosen by that key.
#
# Commands run in the console's shell, in the active panel's directory.
# !.! is the file at the cursor, ! its name without the extension, .! the
# extension, !\ its directory (ending in /), !/ the same without the /; $.!,
# $, $\ and $/ the same in the other panel.  %1 is a file listing the tagged
# names (or the one at the cursor).  A line <Title asks for parameters
# first (<=text fills them in), %3..%9 being the words typed.  A line <|
# puts what the item prints into the active panel, a file name a line.
# A line <& runs the item in a window of its own instead of the console;
# the words zoomed or normal, modal or floating after it say how the window
# opens (<& normal modal), else System Setup's Command windows do.  A command
# starting & does the same, as on the command line: Run = &./!.!
# A $, ! or % meant for the shell is written twice: $$HOME.

~E~dit with $$EDITOR = $${EDITOR:-vi} !.!
~O~pen with default application = xdg-open !.! >/dev/null 2>&1 &
File ~i~nfo = file !.!
    stat !.!
~R~un in window = &!.!
-

[~F~iles]
~C~ompare with the other panel's = diff -u !.! $\!.! | less
~S~HA-256 of tagged files = xargs -d '\n' sha256sum < %1
Make ~e~xecutable = chmod +x !.!
Count ~l~ines = wc -l !.!
-
~D~isk usage here = du -sh -- * | sort -h
~F~ree space = df -h !/

[~A~rchive]
~L~ist = case !.! in *.zip) unzip -l !.! | less ;; *) tar tvf !.! | less ;; esac
~E~xtract here = case !.! in *.zip) unzip !.! ;; *) tar xvf !.! ;; esac
Extract to the ~o~ther panel = case !.! in *.zip) unzip !.! -d $/ ;; *) tar xvf !.! -C $/ ;; esac
-
Pack tagged as ~t~ar.gz = <Archive name
    <=archive
    tar czvf %3.tar.gz -T %1
Pack tagged as ~z~ip = <Archive name
    <=archive
    zip -r %3.zip -@ < %1

[~G~it]
~S~tatus = git status
~L~og = git log --oneline --graph --decorate -30
~D~iff = git diff
Diff this ~f~ile = git diff -- !.!
~C~hanged files to the panel = <|
    git ls-files -m -o --exclude-standard
~B~lame this file = git blame -- !.! | less
-
~P~ull = git pull

[~S~earch]
Find files by ~n~ame = <Name pattern
    find . -iname %3
Find ~t~ext in files = <Text to find
    grep -rn -- %3 .
Files ~h~olding text to the panel = <Text to find
    <|
    grep -rl -- %3 .

[S~y~stem]
~P~rocesses by CPU = ps aux --sort=-%%cpu | head -20
~M~emory = free -h
Mounted ~f~ilesystems = df -h
Listening ~p~orts = ss -tuln
~U~ptime and load = uptime
~T~op in a window = <&
    top
