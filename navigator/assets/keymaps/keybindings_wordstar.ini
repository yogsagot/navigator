# Navigator key bindings: WordStar's editor keys.
#
# What DOS Navigator's editor bound before Navigator gave the modern keys
# their usual meaning: the Ctrl+E/S/D/X diamond, Ctrl+A/F words, Ctrl+R/C
# pages, Ctrl+W/Z scrolling, Ctrl+G/T deleting and the two-key Ctrl+K, Ctrl+Q
# and Ctrl+B commands (^K B/^K K mark a block, ^Q F finds, ^K 1..9 places a
# marker ...). Ctrl+X/C/V stay the clipboard's; keybindings_dn151.ini gives
# them back to WordStar as well.
#
# Load it from Options > Configuration > Key bindings > Load. A command not
# named here keeps its default key.

[editor]
move_left = left, ctrl+s                    # default: left
move_right = right, ctrl+d                  # default: right
move_up = up, ctrl+e                        # default: up
word_left = ctrl+left, ctrl+a               # default: ctrl+left
word_right = ctrl+right, ctrl+f             # default: ctrl+right
page_up = pageup, ctrl+r                    # default: pageup
scroll_up = ctrl+up, ctrl+w                 # default: ctrl+up
scroll_down = ctrl+down, ctrl+z             # default: ctrl+down
delete_char = delete, ctrl+g                # default: delete
undo = alt+backspace, ctrl+q l, ctrl+q ctrl+l  # default: alt+backspace, ctrl+z
clear = ctrl+delete, ctrl+k y, ctrl+k ctrl+y  # default: ctrl+delete
hide_block = alt+h, ctrl+k h, ctrl+k ctrl+h  # default: alt+h
sort_block = alt+t, ctrl+k s, ctrl+k ctrl+s  # default: alt+t
goto_line_number = alt+g                    # default: alt+g, ctrl+g
switch_draw_mode = f4, ctrl+q m, ctrl+q ctrl+m, ctrl+q enter  # default: f4
bracket_pair = alt+left, alt+right, ctrl+q [, ctrl+q ctrl+]  # default: alt+left, alt+right
f_justify = alt+j, ctrl+b j, ctrl+b ctrl+j  # default: alt+j
f_right = alt+r, ctrl+b r, ctrl+b ctrl+r    # default: alt+r
f_left = alt+l, ctrl+b l, ctrl+b ctrl+l     # default: alt+l
f_center = alt+c, ctrl+b c, ctrl+b ctrl+c   # default: alt+c
start_search = ctrl+q f, ctrl+q ctrl+f      # default: ctrl+f
replace = ctrl+q a, ctrl+q ctrl+a           # default: ctrl+r
delete_word_right = ctrl+t                  # default: no key
switch_block = ctrl+b v, ctrl+b ctrl+v      # default: no key
block_start = ctrl+k b, ctrl+k ctrl+b       # default: no key
block_end = ctrl+k k, ctrl+k ctrl+k         # default: no key
copy_block = ctrl+k c, ctrl+k ctrl+c, alt+shift+k  # default: alt+shift+k
move_block = ctrl+k v, ctrl+k ctrl+v, alt+shift+v  # default: alt+shift+v
indent_block = ctrl+k i, ctrl+k ctrl+i, alt+shift+i  # default: alt+shift+i
unindent_block = ctrl+k u, ctrl+k ctrl+u    # default: no key
upcase_block = ctrl+k [, alt+shift+u        # default: alt+shift+u
lowcase_block = ctrl+k ], alt+shift+l       # default: alt+shift+l
capitalize_block = ctrl+k \, alt+shift+c    # default: alt+shift+c
mark_word = ctrl+k t, ctrl+k ctrl+t         # default: no key
mark_line = ctrl+k l, ctrl+k ctrl+l         # default: no key
print_block = ctrl+k p, ctrl+k ctrl+p       # default: no key
block_read = ctrl+k r, ctrl+k ctrl+r        # default: no key
block_write = ctrl+k w, ctrl+k ctrl+w       # default: no key
place_marker_1 = ctrl+k 1                   # default: no key
place_marker_2 = ctrl+k 2                   # default: no key
place_marker_3 = ctrl+k 3                   # default: no key
place_marker_4 = ctrl+k 4                   # default: no key
place_marker_5 = ctrl+k 5                   # default: no key
place_marker_6 = ctrl+k 6                   # default: no key
place_marker_7 = ctrl+k 7                   # default: no key
place_marker_8 = ctrl+k 8                   # default: no key
place_marker_9 = ctrl+k 9                   # default: no key
move_block_start = ctrl+q b, ctrl+q ctrl+b  # default: no key
move_block_end = ctrl+q k, ctrl+q ctrl+k    # default: no key
delete_to_end = ctrl+q y, ctrl+q ctrl+y     # default: no key
insert_date = ctrl+q d, ctrl+q ctrl+d, alt+shift+d  # default: alt+shift+d
insert_time = ctrl+q t, ctrl+q ctrl+t, alt+shift+t  # default: alt+shift+t
reverse_search = ctrl+q r, ctrl+q ctrl+r    # default: no key
goto_marker_1 = ctrl+q 1                    # default: no key
goto_marker_2 = ctrl+q 2                    # default: no key
goto_marker_3 = ctrl+q 3                    # default: no key
goto_marker_4 = ctrl+q 4                    # default: no key
goto_marker_5 = ctrl+q 5                    # default: no key
goto_marker_6 = ctrl+q 6                    # default: no key
goto_marker_7 = ctrl+q 7                    # default: no key
goto_marker_8 = ctrl+q 8                    # default: no key
goto_marker_9 = ctrl+q 9                    # default: no key

[edit_window]
save_text = f2                              # default: f2, ctrl+s
