# Navigator key bindings: Emacs's editing keys.
#
# Ctrl+F/B/N/P and Alt+F/B move, Ctrl+A/E go to a line's ends, Ctrl+V and
# Alt+V page, Alt+< and Alt+> go to the text's ends; Ctrl+D, Alt+D and
# Ctrl+K delete, Ctrl+W/Alt+W/Ctrl+Y cut, copy and paste, Ctrl+_ undoes;
# Ctrl+S and Ctrl+R search, Alt+% replaces; Ctrl+X Ctrl+S saves, Ctrl+X
# Ctrl+W saves as, Ctrl+X Ctrl+F opens, Ctrl+X K closes.
#
# Not Emacs: there is no mark set with Ctrl+Space and no kill ring -- Shift
# with a movement marks a block, and the clipboard is the one clipboard.
# Inside the editor the Alt letters above are the editor's, not the menu
# bar's: F10 still opens the menu. The ASCII table moves from Ctrl+B to
# Ctrl+Shift+B (with the kitty keyboard protocol; it is on the menu too).
#
# Load it from Options > Configuration > Key bindings > Load. A command not
# named here keeps its default key.

[global]
ascii_table = ctrl+shift+b                  # default: ctrl+b

[editor]
move_left = left, ctrl+b                    # default: left
move_right = right, ctrl+f                  # default: right
move_up = up, ctrl+p                        # default: up
move_down = down, ctrl+n                    # default: down
word_left = ctrl+left, alt+b                # default: ctrl+left
word_right = ctrl+right, alt+f              # default: ctrl+right
line_start = home, ctrl+a                   # default: home
select_all =                                # default: ctrl+a
line_end = end, ctrl+e                      # default: end
page_up = pageup, alt+v                     # default: pageup
page_down = pagedown, ctrl+v                # default: pagedown
text_start = ctrl+pageup, alt+<             # default: ctrl+pageup
text_end = ctrl+pagedown, alt+>             # default: ctrl+pagedown
insert_line =                               # default: ctrl+n
delete_char = delete, ctrl+d                # default: delete
delete_word_left = ctrl+backspace, alt+backspace  # default: ctrl+backspace
delete_line = ctrl+shift+backspace          # default: ctrl+y
undo = ctrl+_, ctrl+/, ctrl+x u, ctrl+z     # default: alt+backspace, ctrl+z
clipboard_cut = shift+delete, ctrl+w, ctrl+alt+x  # default: shift+delete, ctrl+x, ctrl+alt+x
clipboard_copy = ctrl+insert, alt+w, ctrl+alt+c  # default: ctrl+insert, ctrl+c, ctrl+alt+c
clipboard_paste = shift+insert, ctrl+y, ctrl+alt+v  # default: shift+insert, ctrl+v, ctrl+alt+v
goto_line_number = alt+g                    # default: alt+g, ctrl+g
ascii_table =                               # default: ctrl+p
start_search = ctrl+s                       # default: ctrl+f
replace = alt+%                             # default: ctrl+r
delete_word_right = alt+d                   # default: no key
delete_to_end = ctrl+k                      # default: no key
reverse_search = ctrl+r                     # default: no key

[edit_window]
close_window = escape, alt+f3, ctrl+x k     # default: escape, alt+f3
save_text = f2, ctrl+x ctrl+s               # default: f2, ctrl+s
load_text = f3, ctrl+x ctrl+f               # default: f3
save_text_as = shift+f2, ctrl+x ctrl+w      # default: shift+f2
save_all = ctrl+f2, ctrl+x s                # default: ctrl+f2
