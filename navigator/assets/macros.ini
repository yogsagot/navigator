; macros.ini -- the editor's macros: DOS Navigator's MACRO blocks, which it
; read from DN.HGL.  In the editor, Ctrl+J 0 offers the macros of the file's
; type and plays the one chosen.  (Ctrl+J R 1..9 records the keys typed,
; anywhere, into a slot, and Ctrl+J 1..9 plays a slot: those are kept in
; Navigator's database, not here.)
;
; A section names the files its macros are for, masks separated by ';';
; [*] is for every file.  A macro is
;
;   MACRO name
;     ...lines...
;   ENDMACRO
;
; and each line one of:
;
;   PRINT 'text', n      the text typed, n times (n may be left out); in quotes
;                        '' is a quote; outside them ^M is a control character
;                        (Enter) and #13 a character by its code:
;                        PRINT 'begin'^M'end;'
;   GOTOXY x, y          the cursor to column x of line y, both from 0
;   GOTOX x / GOTOY y    the column alone, or the line alone
;   MARK n / GOTO n      set marker n (1..9), or go to it
;   Command, n           an editor command, n times: DN's names (WordLeft,
;                        MoveUp, DelChar, InsertDate, UpBlock...) or
;                        keybindings.ini's (word_left, move_up, insert_date)
;
; A ; starts a comment line.

[*]
MACRO Date and time
  InsertDate
  PRINT ' '
  InsertTime
ENDMACRO

MACRO Duplicate line below
  DuplicateLine
  MoveDown
ENDMACRO

[*.pas;*.pp;*.inc]
MACRO begin ... end
  PRINT 'begin'^M^M'end;'
  MoveUp
  PRINT '  '
ENDMACRO

[*.py]
MACRO main guard
  CtrlEnd
  PRINT ^M'if __name__ == ''__main__'':'^M'    main()'^M
ENDMACRO
