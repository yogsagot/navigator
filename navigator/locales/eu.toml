"Colour scheme, one of `nav --list-themes`" = "Kolore-eskema, `nav --list-themes`-eko bat"
# navigator/settings.py
"What a colour name means: DN's VGA value, or the terminal's own scheme" = "Kolore-izen batek zer esan nahi duen: DNren VGA balioa, edo terminalaren eskema propioa"
# navigator/settings.py
"How many colours the terminal shows; auto reads COLORTERM and TERM" = "Terminalak zenbat kolore erakusten dituen; auto-k COLORTERM eta TERM irakurtzen ditu"
# navigator/settings.py
"Which characters the terminal's font draws" = "Terminalaren letra-tipoak zein karaktere marrazten dituen"
# navigator/settings.py
"How check boxes and radio buttons are drawn: dos [X] (•), brackets [✓] (●), boxes without brackets" = "Nola marrazten diren kontrol-laukiak eta aukera-botoiak: dos [X] (•), brackets [✓] (●), boxes kakorik gabe"
# navigator/settings.py
"Paint what lies behind a dialog faint" = "Ilundu elkarrizketa-koadro baten atzean dagoena"
# navigator/settings.py
"F4 opens the internal editor; off runs $EDITOR" = "F4-k barneko editorea irekitzen du; desaktibatuta, $EDITOR exekutatzen du"
# navigator/settings.py
"F3 opens the internal viewer; off runs $PAGER" = "F3-k barneko ikustailea irekitzen du; desaktibatuta, $PAGER exekutatzen du"
# navigator/settings.py
"Copy to and paste from the desktop's clipboard; off, Navigator's own" = "Kopiatu mahaigaineko arbelera eta itsatsi hartatik; desaktibatuta, Navigatorren arbel propioa"
# navigator/settings.py
"A new panel shows hidden files (Ctrl+H toggles one)" = "Panel berri batek fitxategi ezkutuak erakusten ditu (Ctrl+H-k bat aldatzen du)"
# navigator/settings.py
"Sync each file to disk as it is copied" = "Sinkronizatu fitxategi bakoitza diskoarekin kopiatzen den bitartean"
# navigator/settings.py
"Ctrl+O shows the console inside Navigator; off hands the real terminal to the shell, as mc does" = "Ctrl+O-k terminala Navigatorren barruan erakusten du; desaktibatuta, benetako terminala shell-ari ematen dio, mc-k bezala"
# navigator/settings.py
"Temporary directory; empty means $TMPDIR" = "Aldi baterako fitxategien karpeta; hutsik, $TMPDIR"
# navigator/settings.py
"An unexpected error shows a box with its traceback, or quits printing it" = "Ustekabeko errore batek traceback-a duen laukia erakusten du, edo irten egiten da hura inprimatuz"
# navigator/settings.py
"Seconds Navigator may stop responding before errors.log records why; 0 never" = "Navigatorrek erantzun gabe egon ditzakeen segundoak errors.log-ek zergatia idatzi aurretik; 0 inoiz ez"
# navigator/settings.py
"A step refused permission may be done again as root through sudo or pkexec; auto is sudo, else pkexec" = "Baimena ukatutako urrats bat root gisa errepika daiteke sudo edo pkexec bidez; auto sudo da, bestela pkexec"
# navigator/settings.py
"Minutes root access stays open after its last use; 0 closes it after each operation" = "Root sarbidea azken erabileraren ondoren irekita dagoen minutuak; 0-k eragiketa bakoitzaren ondoren ixten du"
# navigator/settings.py
"The desktop's plumbing for volumes, links and opening files: GIO, KIO, or off; auto is KIO under KDE, else GIO" = "Mahaigainaren hodiak unitateetarako, estekatarako eta fitxategiak irekitzeko: GIO, KIO edo off; auto KIO da KDEn, bestela GIO"
# navigator/settings.py
"When a long operation ends while the terminal is in the background, tell the desktop: through the terminal (OSC 9/777), notify-send, or off; auto picks what this terminal shows" = "Eragiketa luze bat terminala atzeko planoan dagoela amaitzen denean, jakinarazi mahaigainari: terminalaren bidez (OSC 9/777), notify-send edo off; auto-k terminal honek erakusten duena aukeratzen du"
# navigator/settings.py
"Auto run the User Menu" = "Exekutatu erabiltzaile-menua abiaraztean"
# navigator/settings.py
"Clear the unpinned history entries on startup" = "Garbitu finkatu gabeko historia-sarrerak abiaraztean"
# navigator/settings.py
"Exit after an hour of inactivity" = "Irten ordubete geldirik egon ondoren"
# navigator/settings.py
"Save the desktop on exit and restore it at the next start" = "Gorde mahaigaina irtetean eta leheneratu hurrengo abiaraztean"
# navigator/settings.py
"The active panel keeps its directory after a command and in a restored desktop" = "Panel aktiboak bere karpeta mantentzen du komando baten ondoren eta leheneratutako mahaigain batean"
# navigator/settings.py
"Show the clock at the menu bar's right end" = "Erakutsi erlojua menu-barraren eskuineko muturrean"
# navigator/settings.py
"Hide the menu bar until F10" = "Ezkutatu menu-barra F10 arte"
# navigator/settings.py
"Hide the key bar" = "Ezkutatu tekla-barra"
# navigator/settings.py
"Esc on an empty command line shows the user screen until a key, as Alt+F5" = "Komando-lerro hutsean, Esc-ek erabiltzaile-pantaila erakusten du tekla bat sakatu arte, Alt+F5-ek bezala"
# navigator/settings.py
"Hide the command line, and type nothing on it" = "Ezkutatu komando-lerroa, eta ez idatzi ezer bertan"
# navigator/settings.py
"Hide the command line while it is empty" = "Ezkutatu komando-lerroa hutsik dagoen bitartean"
# navigator/settings.py
"Block cursor on the command line" = "Bloke-kurtsorea komando-lerroan"
# navigator/settings.py
"Open a new editor where the last one was" = "Ireki editore berria azkena zegoen lekuan"
# navigator/settings.py
"Reopen a tracked file in the viewer at its window, scroll and cursor" = "Ireki berriro jarraitutako fitxategia ikustailean bere leiho, korritze eta kurtsorearekin"
# navigator/settings.py
"Track editing history: Alt+PgUp, modes restored" = "Jarraitu edizio-historiari: Alt+PgUp, moduak leheneratuta"
# navigator/settings.py
"Track viewing history: Alt+PgDn, modes restored" = "Jarraitu ikuspen-historiari: Alt+PgDn, moduak leheneratuta"
# navigator/settings.py
"Track directories: Alt+Backspace lists where the panels have been" = "Jarraitu karpetei: Alt+Backspace-k panelak non egon diren erakusten du"
# navigator/settings.py
