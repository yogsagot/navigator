"Encoding writes the statistics block" = "Kodeketak estatistika-blokea idazten du"
# navigator/settings.py
"Encoding's checksum level" = "Kodeketaren kontrol-maila"
# navigator/settings.py
"Encoded lines per section (at least 10)" = "Atal bakoitzeko lerro kodetuak (gutxienez 10)"
# navigator/settings.py
"Encoded files' line ends" = "Fitxategi kodetuen lerro-amaierak"
# navigator/settings.py
"Decoding asks before writing over a file" = "Deskodeketak galdetu egiten du fitxategi bat gainidatzi aurretik"
# navigator/settings.py
"Decoding shows each error as it finds it" = "Deskodeketak errore bakoitza erakusten du aurkitu ahala"
# navigator/settings.py
"Decoding keeps a file it could not decode whole" = "Deskodeketak osorik deskodetu ezin izan duen fitxategi bat gordetzen du"
# navigator/settings.py
"The size of each part: 100M, 1.44M, 4G or bytes" = "Zati bakoitzaren tamaina: 100M, 1.44M, 4G edo byteak"
# navigator/settings.py
"Split writes the set's NAME.crc, which Combine checks" = "Zatiketak multzoaren IZENA.crc idazten du, Batu-k egiaztatzen duena"
# navigator/settings.py
"Write each file's directory with its name" = "Idatzi fitxategi bakoitzaren karpeta bere izenarekin"
# navigator/settings.py
"Write the directory only where it is not the list's own" = "Idatzi karpeta zerrendaren karpeta bera ez denean soilik"
# navigator/settings.py
"The digest Calculate writes" = "Kalkulatu-k idazten duen hasha"
# navigator/settings.py
"One list for all the files, or one beside each file" = "Zerrenda bat fitxategi guztientzat, edo bat fitxategi bakoitzaren ondoan"
# navigator/settings.py
"The encoding the files are written in, or keep each file's" = "Fitxategiak idazten diren kodeketa, edo bakoitzarena mantendu"
# navigator/settings.py
"The line endings the files get, or keep each line's" = "Fitxategiek hartzen dituzten lerro-amaierak, edo lerro bakoitzarena mantendu"
# navigator/settings.py
"What a file that is not UTF-8 is read as: utf-8 leaves it alone, or a code page" = "UTF-8 ez den fitxategi bat nola irakurtzen den: utf-8-k bere horretan uzten du, edo kode-orri bat"
# navigator/settings.py
"A converted file keeps its modification time" = "Bihurtutako fitxategi batek bere aldaketa-ordua mantentzen du"
# navigator/settings.py
"The program Encrypt runs" = "Zifratu-k exekutatzen duen programa"
# navigator/settings.py
"Encrypt to a passphrase, or to recipients' keys" = "Zifratu pasaesaldi batekin, edo hartzaileen gakoekin"
# navigator/settings.py
"Encrypted files are ASCII text (gpg: .asc)" = "Fitxategi zifratuak ASCII testua dira (gpg: .asc)"
# navigator/settings.py
"Encrypt removes each file once its encrypted copy is written" = "Zifratu-k fitxategi bakoitza kentzen du bere kopia zifratua idatzita dagoenean"
# navigator/settings.py
"The last recipients: gpg key IDs, or age keys or files of them, by spaces" = "Azken hartzaileak: gpg gako-IDak, edo age gakoak edo haien fitxategiak, zuriunez bereizita"
# navigator/settings.py
"age identity files Decrypt tries, by spaces; empty: $XDG_CONFIG_HOME/age/keys.txt if it is there" = "Deszifratu-k probatzen dituen age nortasun-fitxategiak, zuriunez bereizita; hutsik: $XDG_CONFIG_HOME/age/keys.txt badago"
# navigator/settings.py
"Which files and directories (ending in /) are compared; - before one leaves it out" = "Zein fitxategi eta karpeta (/ amaieran) konparatzen diren; aurrean - jartzeak baztertzen du"
# navigator/settings.py
"How far apart two times may be and be the same: exact, fat (2 s) or minute" = "Bi ordu elkarrengandik zein urrun egon daitezkeen berdintzat hartzeko: exact, fat (2 s) edo minute"
# navigator/settings.py
"Times exactly an hour apart are the same, as daylight saving leaves them" = "Zehazki ordubete desberdinak diren orduak berdinak dira, udako ordutegiak uzten dituen bezala"
# navigator/settings.py
"The right side becomes a copy of the left: what only it has is deleted" = "Eskuineko aldea ezkerrekoaren kopia bihurtzen da: berak bakarrik duena ezabatzen da"
# navigator/settings.py
"Seconds between reads of the process list while it is open; 0 reads only on Ctrl+R" = "Prozesu-zerrendaren irakurketen arteko segundoak irekita dagoen bitartean; 0-k Ctrl+R-rekin soilik irakurtzen du"
# navigator/settings.py
"The service manager Services works: auto (the one running), systemd, openrc, runit or sysvinit" = "Zerbitzuak-ek erabiltzen duen zerbitzu-kudeatzailea: auto (martxan dagoena), systemd, openrc, runit edo sysvinit"
# navigator/settings.py
"Seconds between reads of the units while Services is open; 0 reads only on Ctrl+R" = "Unitateen irakurketen arteko segundoak Zerbitzuak irekita dagoen bitartean; 0-k Ctrl+R-rekin soilik irakurtzen du"
# navigator/settings.py
"How many of a unit's last journal lines F3 shows before following it" = "Unitate baten egunkariko azken zenbat lerro erakusten dituen F3-k jarraitu aurretik"
# navigator/settings.py
"Seconds between reads of the system monitor while it is open; 0 reads only on Ctrl+R" = "Sistema-monitorearen irakurketen arteko segundoak irekita dagoen bitartean; 0-k Ctrl+R-rekin soilik irakurtzen du"
# navigator/settings.py
"Seconds between keep-alive messages to a server; 0 sends none" = "Zerbitzari bati keep-alive mezuen arteko segundoak; 0-k ez du bat ere bidaltzen"
# navigator/settings.py
"Minutes a connection nothing uses stays open before it is closed; 0 keeps it" = "Inork erabiltzen ez duen konexio bat ixten den arte irekita dagoen minutuak; 0-k mantentzen du"
# navigator/settings.py
"A file from another drive that a program changed goes back: ask, always or never" = "Programa batek aldatutako beste unitate bateko fitxategia itzultzen da: ask, always edo never"
# navigator/settings.py
"Seconds to wait for a server to answer when connecting" = "Konektatzean zerbitzariaren erantzunaren zain egoteko segundoak"
# navigator/settings.py
"Words added to every Remote shell's ssh command, before a connection's own" = "Urruneko shell-aren ssh komando bakoitzari gehitutako hitzak, konexioarenen aurretik"
# navigator/settings.py
"Seconds between looks at a server's directory for Auto refresh; 0 never" = "Zerbitzari baten karpetaren egiaztapenen arteko segundoak freskatze automatikorako; 0 inoiz ez"
