# navigator/settings.py
"Minutes root access stays open after its last use; 0 closes it after each operation" = "Минути, през които root достъпът остава отворен след последната употреба; 0 го затваря след всяка операция"
# navigator/settings.py
"The desktop's plumbing for volumes, links and opening files: GIO, KIO, or off; auto is KIO under KDE, else GIO" = "Инфраструктурата на работния плот за томове, връзки и отваряне на файлове: GIO, KIO или изключено; auto е KIO под KDE, иначе GIO"
# navigator/settings.py
"When a long operation ends while the terminal is in the background, tell the desktop: through the terminal (OSC 9/777), notify-send, or off; auto picks what this terminal shows" = "Когато дълга операция завърши, докато терминалът е във фон, уведомява работния плот: чрез терминала (OSC 9/777), notify-send, или изключено; auto избира това, което този терминал показва"
# navigator/settings.py
"Auto run the User Menu" = "Автостарт на потребителското меню"
# navigator/settings.py
"Clear the unpinned history entries on startup" = "Изчистване на незакачените записи в историята при стартиране"
# navigator/settings.py
"Exit after an hour of inactivity" = "Изход след час бездействие"
# navigator/settings.py
