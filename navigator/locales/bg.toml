# navigator/settings.py
"Encrypt to a passphrase, or to recipients' keys" = "Шифриране с парола, или с ключовете на получателите"
# navigator/settings.py
"Encrypted files are ASCII text (gpg: .asc)" = "Шифрираните файлове са ASCII текст (gpg: .asc)"
# navigator/settings.py
"Encrypt removes each file once its encrypted copy is written" = "Шифрирането премахва всеки файл, щом шифрираното му копие е записано"
# navigator/settings.py
"The last recipients: gpg key IDs, or age keys or files of them, by spaces" = "Последните получатели: ID на gpg ключове, или age ключове или файлове с тях, разделени с интервали"
# navigator/settings.py
"age identity files Decrypt tries, by spaces; empty: $XDG_CONFIG_HOME/age/keys.txt if it is there" = "Файлове за идентичност age, които опитва Дешифриране, разделени с интервали; празно: $XDG_CONFIG_HOME/age/keys.txt, ако съществува"
# navigator/settings.py
"Which files and directories (ending in /) are compared; - before one leaves it out" = "Кои файлове и папки (завършващи с /) се сравняват; - пред някой го изключва"
# navigator/settings.py
"How far apart two times may be and be the same: exact, fat (2 s) or minute" = "Колко може да се различават две времена и да са еднакви: exact, fat (2 s) или minute"
# navigator/settings.py
"Times exactly an hour apart are the same, as daylight saving leaves them" = "Времена с точно час разлика са еднакви, както ги оставя лятното часово време"
# navigator/settings.py
"The right side becomes a copy of the left: what only it has is deleted" = "Дясната страна става копие на лявата: това, което има само тя, се изтрива"
# navigator/settings.py
"Seconds between reads of the process list while it is open; 0 reads only on Ctrl+R" = "Секунди между четенията на списъка с процеси, докато е отворен; 0 чете само при Ctrl+R"
# navigator/settings.py
"The service manager Services works: auto (the one running), systemd, openrc, runit or sysvinit" = "Диспечерът на услуги, с който работят Услуги: auto (работещият), systemd, openrc, runit или sysvinit"
# navigator/settings.py
"Seconds between reads of the units while Services is open; 0 reads only on Ctrl+R" = "Секунди между четенията на единиците, докато Услуги е отворен; 0 чете само при Ctrl+R"
# navigator/settings.py
"How many of a unit's last journal lines F3 shows before following it" = "Колко от последните редове на журнала на единица показва F3, преди да го следи"
# navigator/settings.py
"Seconds between reads of the system monitor while it is open; 0 reads only on Ctrl+R" = "Секунди между четенията на системния монитор, докато е отворен; 0 чете само при Ctrl+R"
# navigator/settings.py
"Seconds between keep-alive messages to a server; 0 sends none" = "Секунди между съобщенията keep-alive към сървър; 0 не праща никакви"
# navigator/settings.py
"Minutes a connection nothing uses stays open before it is closed; 0 keeps it" = "Минути, през които неизползвана връзка остава отворена, преди да се затвори; 0 я пази"
# navigator/settings.py
"A file from another drive that a program changed goes back: ask, always or never" = "Файл от друго устройство, променен от програма, се връща: ask, always или never"
# navigator/settings.py
"Seconds to wait for a server to answer when connecting" = "Секунди изчакване на отговор от сървъра при свързване"
# navigator/settings.py
"Words added to every Remote shell's ssh command, before a connection's own" = "Думи, добавяни към всяка команда ssh на отдалечената обвивка, преди собствените на връзката"
# navigator/settings.py
"Seconds between looks at a server's directory for Auto refresh; 0 never" = "Секунди между проверките на папката на сървъра за автообновяване; 0 никога"
