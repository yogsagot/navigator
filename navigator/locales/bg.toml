"Tell zoxide every directory a panel comes to, where zoxide is installed" = "Съобщаване на zoxide за всяка папка, в която отива панел, където zoxide е инсталиран"
# navigator/settings.py
"Entries kept per history list: input lines, viewed and edited files" = "Записи за всеки списък с история: редове за въвеждане, прегледани и редактирани файлове"
# navigator/settings.py
"The language captions and messages are in: a catalogue's code (en, lv, ...), or empty to follow $LANG" = "Езикът на надписите и съобщенията: код на каталог (en, lv, ...), или празно за следване на $LANG"
# navigator/settings.py
