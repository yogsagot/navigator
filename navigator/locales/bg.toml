# navigator/settings.py
"Where Options > Settings shows its tabs: a row on top, a column on the left, or simple, a plain row of captions on top" = "Къде Опции > Настройки показва разделите си: ред отгоре, колона отляво, или simple, обикновен ред с надписи отгоре"
# navigator/settings.py
"The windows listed on the menu bar, Win+1 .. Win+9's numbers: off, numbers alone, or numbers and titles" = "Прозорците в меню лентата, номерата на Win+1 .. Win+9: изключено, само номера, или номера и заглавия"
