"age identity files Decrypt tries, by spaces; empty: $XDG_CONFIG_HOME/age/keys.txt if it is there" = "age-identiteitsbestanden die Ontsleutelen probeert, door spaties gescheiden; leeg: $XDG_CONFIG_HOME/age/keys.txt als het er is"
# navigator/settings.py
"Which files and directories (ending in /) are compared; - before one leaves it out" = "Welke bestanden en mappen (eindigend op /) worden vergeleken; - ervoor laat er een weg"
# navigator/settings.py
