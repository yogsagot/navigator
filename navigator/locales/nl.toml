# navigator/settings.py
"The service manager Services works: auto (the one running), systemd, openrc, runit or sysvinit" = "De servicebeheerder waarmee Services werkt: auto (de draaiende), systemd, openrc, runit of sysvinit"
# navigator/settings.py
"Seconds between reads of the units while Services is open; 0 reads only on Ctrl+R" = "Seconden tussen lezingen van de units zolang Services open is; 0 leest alleen bij Ctrl+R"
# navigator/settings.py
"How many of a unit's last journal lines F3 shows before following it" = "Hoeveel van de laatste journaalregels van een unit F3 toont voordat het die volgt"
# navigator/settings.py
"Seconds between reads of the system monitor while it is open; 0 reads only on Ctrl+R" = "Seconden tussen lezingen van de systeemmonitor zolang die open is; 0 leest alleen bij Ctrl+R"
# navigator/settings.py
"Seconds between keep-alive messages to a server; 0 sends none" = "Seconden tussen keep-alive-berichten aan een server; 0 stuurt er geen"
