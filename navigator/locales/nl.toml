# navigator/settings.py
"Times exactly an hour apart are the same, as daylight saving leaves them" = "Tijden precies een uur uit elkaar zijn gelijk, zoals zomertijd ze laat"
# navigator/settings.py
"The right side becomes a copy of the left: what only it has is deleted" = "De rechterkant wordt een kopie van de linker: wat alleen hij heeft wordt verwijderd"
# navigator/settings.py
