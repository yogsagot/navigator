# navigator/settings.py
"Track directories: Alt+Backspace lists where the panels have been" = "Отслеживать каталоги: Alt+Backspace показывает, где были панели"
# navigator/settings.py
"Tell zoxide every directory a panel comes to, where zoxide is installed" = "Сообщать zoxide каждый каталог, в который приходит панель, если zoxide установлен"
# navigator/settings.py
"Entries kept per history list: input lines, viewed and edited files" = "Записей в каждом списке истории: строки ввода, просмотренные и изменённые файлы"
# navigator/settings.py
"The language captions and messages are in: a catalogue's code (en, lv, ...), or empty to follow $LANG" = "Язык подписей и сообщений: код каталога (en, lv, ...) или пусто, чтобы следовать $LANG"
