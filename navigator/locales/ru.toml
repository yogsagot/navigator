"Which way the screen reads: auto (as the language's catalogue says), ltr (left to right) or rtl (right to left, mirrored)" = "В какую сторону читается экран: auto (как сказано в каталоге языка), ltr (слева направо) или rtl (справа налево, зеркально)"
# navigator/settings.py
"Where Options > Settings shows its tabs: a row on top, a column on the left, or simple, a plain row of captions on top" = "Где Параметры > Настройки показывают вкладки: строкой сверху, столбцом слева или просто строкой подписей сверху"
# navigator/settings.py
"The windows listed on the menu bar, Win+1 .. Win+9's numbers: off, numbers alone, or numbers and titles" = "Окна, перечисленные в строке меню, номера Win+1 .. Win+9: выкл., только номера или номера и заголовки"
