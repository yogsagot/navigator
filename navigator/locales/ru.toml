# navigator/settings.py
"A step refused permission may be done again as root through sudo or pkexec; auto is sudo, else pkexec" = "Шаг, которому отказано в доступе, можно повторить от root через sudo или pkexec; auto — sudo, иначе pkexec"
# navigator/settings.py
"Minutes root access stays open after its last use; 0 closes it after each operation" = "Минуты, которые доступ root остаётся открытым после последнего использования; 0 закрывает после каждой операции"
# navigator/settings.py
"The desktop's plumbing for volumes, links and opening files: GIO, KIO, or off; auto is KIO under KDE, else GIO" = "Механизм рабочего стола для томов, соединений и открытия файлов: GIO, KIO или выкл.; auto — KIO в KDE, иначе GIO"
# navigator/settings.py
"When a long operation ends while the terminal is in the background, tell the desktop: through the terminal (OSC 9/777), notify-send, or off; auto picks what this terminal shows" = "Когда долгая операция завершается, пока терминал в фоне, сообщить рабочему столу: через терминал (OSC 9/777), notify-send или никак; авто выбирает то, что показывает этот терминал"
# navigator/settings.py
"Auto run the User Menu" = "Автоматически запускать меню пользователя"
# navigator/settings.py
"Clear the unpinned history entries on startup" = "Очищать незакреплённые записи истории при запуске"
# navigator/settings.py
"Exit after an hour of inactivity" = "Выходить после часа бездействия"
# navigator/settings.py
