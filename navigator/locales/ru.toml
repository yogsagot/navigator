# navigator/settings.py
"One list for all the files, or one beside each file" = "Один список для всех файлов или по одному рядом с каждым"
# navigator/settings.py
"The encoding the files are written in, or keep each file's" = "Кодировка, в которой записываются файлы, или оставить у каждого свою"
# navigator/settings.py
"The line endings the files get, or keep each line's" = "Концы строк, которые получат файлы, или оставить у каждой строки свой"
# navigator/settings.py
"What a file that is not UTF-8 is read as: utf-8 leaves it alone, or a code page" = "Как читается файл не в UTF-8: utf-8 оставляет его как есть, или кодовая страница"
# navigator/settings.py
"A converted file keeps its modification time" = "Преобразованный файл сохраняет время изменения"
# navigator/settings.py
"The program Encrypt runs" = "Программа, которую запускает «Зашифровать»"
# navigator/settings.py
"Encrypt to a passphrase, or to recipients' keys" = "Шифровать паролем или ключами получателей"
# navigator/settings.py
"Encrypted files are ASCII text (gpg: .asc)" = "Зашифрованные файлы — текст ASCII (gpg: .asc)"
# navigator/settings.py
"Encrypt removes each file once its encrypted copy is written" = "«Зашифровать» удаляет каждый файл, когда его зашифрованная копия записана"
# navigator/settings.py
"The last recipients: gpg key IDs, or age keys or files of them, by spaces" = "Последние получатели: ID ключей gpg или ключи age либо файлы с ними, через пробел"
# navigator/settings.py
"age identity files Decrypt tries, by spaces; empty: $XDG_CONFIG_HOME/age/keys.txt if it is there" = "Файлы идентичности age, которые пробует «Расшифровать», через пробел; пусто: $XDG_CONFIG_HOME/age/keys.txt, если он есть"
# navigator/settings.py
"Which files and directories (ending in /) are compared; - before one leaves it out" = "Какие файлы и каталоги (с / на конце) сравниваются; - перед шаблоном исключает его"
# navigator/settings.py
"How far apart two times may be and be the same: exact, fat (2 s) or minute" = "Насколько может различаться время, оставаясь одинаковым: exact, fat (2 с) или minute"
# navigator/settings.py
"Times exactly an hour apart are the same, as daylight saving leaves them" = "Время, отличающееся ровно на час, считается одинаковым, как его оставляет летнее время"
# navigator/settings.py
"The right side becomes a copy of the left: what only it has is deleted" = "Правая сторона становится копией левой: то, что есть только в ней, удаляется"
# navigator/settings.py
"Seconds between reads of the process list while it is open; 0 reads only on Ctrl+R" = "Секунды между чтениями списка процессов, пока он открыт; 0 — только по Ctrl+R"
# navigator/settings.py
"The service manager Services works: auto (the one running), systemd, openrc, runit or sysvinit" = "Менеджер служб для окна Службы: auto (работающий), systemd, openrc, runit или sysvinit"
# navigator/settings.py
"Seconds between reads of the units while Services is open; 0 reads only on Ctrl+R" = "Секунды между чтениями юнитов, пока открыто окно Службы; 0 — только по Ctrl+R"
# navigator/settings.py
"How many of a unit's last journal lines F3 shows before following it" = "Сколько последних строк журнала юнита F3 показывает перед слежением"
# navigator/settings.py
"Seconds between reads of the system monitor while it is open; 0 reads only on Ctrl+R" = "Секунды между чтениями монитора системы, пока он открыт; 0 — только по Ctrl+R"
# navigator/settings.py
"Seconds between keep-alive messages to a server; 0 sends none" = "Секунды между сообщениями keep-alive серверу; 0 — не посылать"
# navigator/settings.py
"Minutes a connection nothing uses stays open before it is closed; 0 keeps it" = "Минуты, которые неиспользуемое соединение остаётся открытым до закрытия; 0 — держать"
# navigator/settings.py
"A file from another drive that a program changed goes back: ask, always or never" = "Файл с другого диска, изменённый программой, отправляется обратно: спрашивать, всегда или никогда"
# navigator/settings.py
"Seconds to wait for a server to answer when connecting" = "Секунды ожидания ответа сервера при подключении"
# navigator/settings.py
"Words added to every Remote shell's ssh command, before a connection's own" = "Слова, добавляемые к каждой команде ssh удалённой оболочки перед параметрами связи"
# navigator/settings.py
"Seconds between looks at a server's directory for Auto refresh; 0 never" = "Секунды между проверками каталога сервера для автообновления; 0 — никогда"

