# navigator/settings.py
"How check boxes and radio buttons are drawn: dos [X] (•), brackets [✓] (●), boxes without brackets" = "איך מצוירות תיבות סימון ולחצני בחירה: dos [X] (•), סוגריים [✓] (●), תיבות ללא סוגריים"
# navigator/settings.py
"Paint what lies behind a dialog faint" = "צבע בעמעום את מה שמאחורי תיבת דו-שיח"
# navigator/settings.py
"F4 opens the internal editor; off runs $EDITOR" = "F4 פותח את העורך הפנימי; כבוי מפעיל את $EDITOR"
# navigator/settings.py
"F3 opens the internal viewer; off runs $PAGER" = "F3 פותח את המציג הפנימי; כבוי מפעיל את $PAGER"
# navigator/settings.py
"Copy to and paste from the desktop's clipboard; off, Navigator's own" = "העתק אל לוח שולחן העבודה והדבק ממנו; כבוי, הלוח של Navigator"
# navigator/settings.py
"A new panel shows hidden files (Ctrl+H toggles one)" = "חלונית חדשה מציגה קבצים מוסתרים (Ctrl+H מחליף באחת)"
# navigator/settings.py
"Sync each file to disk as it is copied" = "סנכרן כל קובץ לדיסק בעת העתקתו"
# navigator/settings.py
"Ctrl+O shows the console inside Navigator; off hands the real terminal to the shell, as mc does" = "Ctrl+O מציג את המסוף בתוך Navigator; כבוי מוסר את המסוף האמיתי למעטפת, כמו mc"
# navigator/settings.py
"Temporary directory; empty means $TMPDIR" = "תיקייה זמנית; ריק פירושו $TMPDIR"
# navigator/settings.py
"An unexpected error shows a box with its traceback, or quits printing it" = "שגיאה בלתי צפויה מציגה תיבה עם מעקב הקריאות, או יוצאת ומדפיסה אותו"
# navigator/settings.py
"Seconds Navigator may stop responding before errors.log records why; 0 never" = "שניות שבהן Navigator רשאי לא להגיב לפני ש-errors.log רושם מדוע; 0 לעולם לא"
# navigator/settings.py
"A step refused permission may be done again as root through sudo or pkexec; auto is sudo, else pkexec" = "פעולה שנדחתה בשל הרשאה ניתן לבצע שוב כ-root דרך sudo או pkexec; auto הוא sudo, אחרת pkexec"
# navigator/settings.py
"Minutes root access stays open after its last use; 0 closes it after each operation" = "דקות שגישת root נשארת פתוחה אחרי השימוש האחרון; 0 סוגר אותה אחרי כל פעולה"
# navigator/settings.py
"The desktop's plumbing for volumes, links and opening files: GIO, KIO, or off; auto is KIO under KDE, else GIO" = "מנגנון שולחן העבודה לכרכים, קישורים ופתיחת קבצים: GIO, KIO או כבוי; auto הוא KIO תחת KDE, אחרת GIO"
# navigator/settings.py
"When a long operation ends while the terminal is in the background, tell the desktop: through the terminal (OSC 9/777), notify-send, or off; auto picks what this terminal shows" = "כשפעולה ארוכה מסתיימת בזמן שהמסוף ברקע, להודיע לשולחן העבודה: דרך המסוף (OSC 9/777), ב-notify-send, או לא; אוטומטי בוחר את מה שהמסוף הזה מציג"
# navigator/settings.py
"Auto run the User Menu" = "הפעל אוטומטית את תפריט המשתמש"
# navigator/settings.py
"Clear the unpinned history entries on startup" = "נקה בהפעלה את רשומות ההיסטוריה שאינן מוצמדות"
# navigator/settings.py
"Exit after an hour of inactivity" = "צא אחרי שעה ללא פעילות"
# navigator/settings.py
"Save the desktop on exit and restore it at the next start" = "שמור את שולחן העבודה ביציאה ושחזר אותו בהפעלה הבאה"
# navigator/settings.py
"The active panel keeps its directory after a command and in a restored desktop" = "החלונית הפעילה שומרת על תיקייתה אחרי פקודה ובשולחן עבודה משוחזר"
# navigator/settings.py
"Show the clock at the menu bar's right end" = "הצג את השעון בקצה הימני של שורת התפריטים"
# navigator/settings.py
"Hide the menu bar until F10" = "הסתר את שורת התפריטים עד F10"
# navigator/settings.py
"Hide the key bar" = "הסתר את שורת המקשים"
# navigator/settings.py
"Esc on an empty command line toggles the console" = "Esc בשורת פקודה ריקה מחליף את המסוף"
# navigator/settings.py
"Hide the command line, and type nothing on it" = "הסתר את שורת הפקודה, ואל תקליד בה דבר"
# navigator/settings.py
"Hide the command line while it is empty" = "הסתר את שורת הפקודה כל עוד היא ריקה"
# navigator/settings.py
"Block cursor on the command line" = "סמן מלבני בשורת הפקודה"
# navigator/settings.py
"Open a new editor where the last one was" = "פתח עורך חדש במקום שבו היה האחרון"
# navigator/settings.py
