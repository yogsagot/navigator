# navigator/settings.py
"An unexpected error shows a box with its traceback, or quits printing it" = "ความผิดพลาดที่ไม่คาดคิดจะแสดงกล่องพร้อม traceback หรือออกพร้อมพิมพ์ออกมา"
# navigator/settings.py
"Seconds Navigator may stop responding before errors.log records why; 0 never" = "วินาทีที่ Navigator หยุดตอบสนองได้ก่อนที่ errors.log จะบันทึกสาเหตุ 0 คือไม่เลย"
# navigator/settings.py
"A step refused permission may be done again as root through sudo or pkexec; auto is sudo, else pkexec" = "ขั้นตอนที่ถูกปฏิเสธสิทธิ์อาจทำซ้ำในฐานะ root ผ่าน sudo หรือ pkexec auto คือ sudo ถ้าไม่มีจึงใช้ pkexec"
# navigator/settings.py
"Minutes root access stays open after its last use; 0 closes it after each operation" = "นาทีที่สิทธิ์ root เปิดค้างหลังใช้ครั้งล่าสุด 0 ปิดหลังทุกการทำงาน"
# navigator/settings.py
"The desktop's plumbing for volumes, links and opening files: GIO, KIO, or off; auto is KIO under KDE, else GIO" = "กลไกของเดสก์ท็อปสำหรับวอลุ่ม ลิงก์ และการเปิดไฟล์: GIO, KIO หรือปิด auto คือ KIO ใน KDE นอกนั้น GIO"
# navigator/settings.py
