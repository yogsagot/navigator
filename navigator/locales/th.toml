"Hide the key bar" = "ซ่อนแถบปุ่ม"
# navigator/settings.py
"Esc on an empty command line shows the user screen until a key, as Alt+F5" = "Esc บนบรรทัดคำสั่งที่ว่างจะแสดงหน้าจอผู้ใช้จนกว่าจะกดปุ่ม แบบ Alt+F5"
