# navigator/settings.py
"Ctrl+O shows the console inside Navigator; off hands the real terminal to the shell, as mc does" = "Ctrl+O แสดงคอนโซลภายใน Navigator ถ้าปิดจะส่งเทอร์มินัลจริงให้เชลล์ แบบ mc"
