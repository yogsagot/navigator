# navigator/settings.py
"F3 opens the internal viewer; off runs $PAGER" = "F3 odpre notranji pregledovalnik; izklopljeno zažene $PAGER"
# navigator/settings.py
"Copy to and paste from the desktop's clipboard; off, Navigator's own" = "Kopiraj v odložišče namizja in lepi iz njega; izklopljeno, Navigatorjevo lastno"
# navigator/settings.py
"A new panel shows hidden files (Ctrl+H toggles one)" = "Nova plošča prikaže skrite datoteke (Ctrl+H preklopi eno)"
# navigator/settings.py
"Sync each file to disk as it is copied" = "Sinhroniziraj vsako datoteko na disk med kopiranjem"
# navigator/settings.py
"Ctrl+O shows the console inside Navigator; off hands the real terminal to the shell, as mc does" = "Ctrl+O prikaže konzolo znotraj Navigatorja; izklopljeno preda pravi terminal lupini, kot mc"
# navigator/settings.py
"Temporary directory; empty means $TMPDIR" = "Začasna mapa; prazno pomeni $TMPDIR"
# navigator/settings.py
"An unexpected error shows a box with its traceback, or quits printing it" = "Nepričakovana napaka prikaže okvir z izpisom, ali konča in ga izpiše"
# navigator/settings.py
"Seconds Navigator may stop responding before errors.log records why; 0 never" = "Sekunde, ko se Navigator sme ne odzivati, preden errors.log zabeleži zakaj; 0 nikoli"
# navigator/settings.py
"A step refused permission may be done again as root through sudo or pkexec; auto is sudo, else pkexec" = "Korak, ki mu je bilo zavrnjeno dovoljenje, se sme ponoviti kot root prek sudo ali pkexec; auto je sudo, sicer pkexec"
# navigator/settings.py
"Minutes root access stays open after its last use; 0 closes it after each operation" = "Minute, ko dostop root ostane odprt po zadnji uporabi; 0 ga zapre po vsakem postopku"
# navigator/settings.py
"The desktop's plumbing for volumes, links and opening files: GIO, KIO, or off; auto is KIO under KDE, else GIO" = "Infrastruktura namizja za nosilce, povezave in odpiranje datotek: GIO, KIO, ali izklopljeno; auto je KIO pod KDE, sicer GIO"
# navigator/settings.py
"When a long operation ends while the terminal is in the background, tell the desktop: through the terminal (OSC 9/777), notify-send, or off; auto picks what this terminal shows" = "Ko se dolg postopek konča, medtem ko je terminal v ozadju, obvesti namizje: prek terminala (OSC 9/777), notify-send, ali izklopljeno; auto izbere, kar ta terminal prikaže"
