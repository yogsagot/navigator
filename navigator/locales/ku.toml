# navigator/settings.py
"Which characters the terminal's font draws" = "Fonta termînalê kîjan tîpan xêz dike"
# navigator/settings.py
"How check boxes and radio buttons are drawn: dos [X] (•), brackets [✓] (●), boxes without brackets" = "Qutiyên kontrolê û bişkokên radyoyê çawa tên xêzkirin: dos [X] (•), kevan [✓] (●), qutiyên bê kevan"
# navigator/settings.py
"Paint what lies behind a dialog faint" = "Tiştê li paş diyalogekê kêmreng xêz bike"
# navigator/settings.py
"F4 opens the internal editor; off runs $EDITOR" = "F4 edîtora hundirîn vedike; girtî $EDITOR dixebitîne"
# navigator/settings.py
"F3 opens the internal viewer; off runs $PAGER" = "F3 nîşandera hundirîn vedike; girtî $PAGER dixebitîne"
# navigator/settings.py
"Copy to and paste from the desktop's clipboard; off, Navigator's own" = "Kopî bike bo panoya sermaseyê û jê pê ve bike; girtî, ya Navigator bi xwe"
# navigator/settings.py
"A new panel shows hidden files (Ctrl+H toggles one)" = "Panelek nû pelên veşartî nîşan dide (Ctrl+H yekê diguherîne)"
# navigator/settings.py
"Sync each file to disk as it is copied" = "Her pelî dema tê kopîkirin bi dîskê re hevdem bike"
# navigator/settings.py
"Ctrl+O shows the console inside Navigator; off hands the real terminal to the shell, as mc does" = "Ctrl+O konsolê di nav Navigator de nîşan dide; girtî termînala rastîn dide şêlê, wek mc dike"
# navigator/settings.py
"Temporary directory; empty means $TMPDIR" = "Peldanka demkî; vala yanî $TMPDIR"
# navigator/settings.py
"An unexpected error shows a box with its traceback, or quits printing it" = "Çewtiyeke neçaverêkirî qutiyekê bi şopa wê nîşan dide, an wê çap dike û derdikeve"
# navigator/settings.py
"Seconds Navigator may stop responding before errors.log records why; 0 never" = "Saniyeyên ku Navigator dikare bersiv nede berî ku errors.log sedemê tomar bike; 0 qet"
# navigator/settings.py
"A step refused permission may be done again as root through sudo or pkexec; auto is sudo, else pkexec" = "Gaveke ku destûr jê re nehatiye dayîn dikare bi sudo an pkexec wek root dîsa bê kirin; auto sudo ye, an na pkexec"
# navigator/settings.py
"Minutes root access stays open after its last use; 0 closes it after each operation" = "Deqeyên ku gihîştina root piştî bikaranîna dawî vekirî dimîne; 0 piştî her karî digire"
# navigator/settings.py
"The desktop's plumbing for volumes, links and opening files: GIO, KIO, or off; auto is KIO under KDE, else GIO" = "Mekanîzmaya sermaseyê ji bo dengdêr, girêdan û vekirina pelan: GIO, KIO an girtî; auto di KDE de KIO ye, an na GIO"
# navigator/settings.py
"When a long operation ends while the terminal is in the background, tell the desktop: through the terminal (OSC 9/777), notify-send, or off; auto picks what this terminal shows" = "Dema kareke dirêj diqede û termînal di paşperdeyê de ye, sermaseyê agahdar bike: bi termînalê (OSC 9/777), notify-send an girtî; auto ya ku ev termînal nîşan dide hildibijêre"
# navigator/settings.py
"Auto run the User Menu" = "Menûya bikarhêner xweber bixebitîne"
# navigator/settings.py
"Clear the unpinned history entries on startup" = "Di destpêkê de tomarên dîrokê yên nezeliqandî paqij bike"
# navigator/settings.py
