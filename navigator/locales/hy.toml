"How many colours the terminal shows; auto reads COLORTERM and TERM" = "Քանի գույն է ցույց տալիս տերմինալը, auto-ն կարդում է COLORTERM և TERM"
# navigator/settings.py
"Which characters the terminal's font draws" = "Որ նիշերն է նկարում տերմինալի տառատեսակը"
# navigator/settings.py
"How check boxes and radio buttons are drawn: dos [X] (•), brackets [✓] (●), boxes without brackets" = "Ինչպես են նկարվում նշավանդակները և ռադիոկոճակները՝ dos [X] (•), brackets [✓] (●), boxes առանց փակագծերի"
# navigator/settings.py
"Paint what lies behind a dialog faint" = "Նկարել երկխոսության հետևում գտնվողը խամրած"
# navigator/settings.py
"F4 opens the internal editor; off runs $EDITOR" = "F4-ը բացում է ներքին խմբագրիչը, անջատված՝ գործարկում է $EDITOR"
# navigator/settings.py
"F3 opens the internal viewer; off runs $PAGER" = "F3-ը բացում է ներքին դիտիչը, անջատված՝ գործարկում է $PAGER"
# navigator/settings.py
"Copy to and paste from the desktop's clipboard; off, Navigator's own" = "Պատճենել և տեղադրել աշխատասեղանի սեղմատախտակից, անջատված՝ Navigator-ի սեփականը"
# navigator/settings.py
"A new panel shows hidden files (Ctrl+H toggles one)" = "Նոր վահանակը ցույց է տալիս թաքնված ֆայլերը (Ctrl+H-ը փոխում է մեկինը)"
# navigator/settings.py
"Sync each file to disk as it is copied" = "Համաժամեցնել ամեն ֆայլ սկավառակի հետ պատճենելիս"
# navigator/settings.py
"Ctrl+O shows the console inside Navigator; off hands the real terminal to the shell, as mc does" = "Ctrl+O-ն ցույց է տալիս կոնսոլը Navigator-ի ներսում, անջատված՝ տալիս է իրական տերմինալը shell-ին, ինչպես mc-ն"
# navigator/settings.py
"Temporary directory; empty means $TMPDIR" = "Ժամանակավոր թղթապանակ, դատարկը նշանակում է $TMPDIR"
# navigator/settings.py
"An unexpected error shows a box with its traceback, or quits printing it" = "Անսպասելի սխալը ցույց է տալիս տուփ traceback-ով, կամ տպում և դուրս է գալիս"
# navigator/settings.py
"Seconds Navigator may stop responding before errors.log records why; 0 never" = "Վայրկյաններ, որ Navigator-ը կարող է չպատասխանել, մինչև errors.log-ը գրանցի պատճառը, 0՝ երբեք"
# navigator/settings.py
"A step refused permission may be done again as root through sudo or pkexec; auto is sudo, else pkexec" = "Մերժված քայլը կարող է կրկնվել root-ով sudo-ի կամ pkexec-ի միջոցով, auto-ն sudo է, հակառակ դեպքում pkexec"
# navigator/settings.py
"Minutes root access stays open after its last use; 0 closes it after each operation" = "Րոպեներ, որ root մուտքը մնում է բաց վերջին օգտագործումից հետո, 0-ն փակում է ամեն գործողությունից հետո"
# navigator/settings.py
"The desktop's plumbing for volumes, links and opening files: GIO, KIO, or off; auto is KIO under KDE, else GIO" = "Աշխատասեղանի մեխանիզմը ծավալների, հղումների և ֆայլերի բացման համար՝ GIO, KIO կամ off, auto-ն KDE-ում KIO, այլապես GIO"
# navigator/settings.py
"When a long operation ends while the terminal is in the background, tell the desktop: through the terminal (OSC 9/777), notify-send, or off; auto picks what this terminal shows" = "Երբ երկար գործողությունն ավարտվում է, մինչ տերմինալը ֆոնում է, տեղեկացնել աշխատասեղանին՝ տերմինալով (OSC 9/777), notify-send, կամ off, auto-ն ընտրում է, ինչ այս տերմինալը ցույց է տալիս"
# navigator/settings.py
"Auto run the User Menu" = "Ավտոգործարկել օգտատիրոջ մենյուն"
# navigator/settings.py
"Clear the unpinned history entries on startup" = "Մեկնարկին մաքրել չամրացված պատմության գրառումները"
# navigator/settings.py
"Exit after an hour of inactivity" = "Ելք մեկ ժամ անգործությունից հետո"
# navigator/settings.py
"Save the desktop on exit and restore it at the next start" = "Ելքին պահել աշխատասեղանը և վերականգնել հաջորդ մեկնարկին"
# navigator/settings.py
"The active panel keeps its directory after a command and in a restored desktop" = "Ակտիվ վահանակը պահում է իր թղթապանակը հրամանից հետո և վերականգնված աշխատասեղանում"
# navigator/settings.py
"Show the clock at the menu bar's right end" = "Ցույց տալ ժամացույցը մենյուի գոտու աջ ծայրում"
# navigator/settings.py
"Hide the menu bar until F10" = "Թաքցնել մենյուի գոտին մինչև F10"
# navigator/settings.py
"Hide the key bar" = "Թաքցնել ստեղների գոտին"
# navigator/settings.py
"Esc on an empty command line shows the user screen until a key, as Alt+F5" = "Esc-ը դատարկ հրամանի տողում ցույց է տալիս օգտատիրոջ էկրանը մինչև ստեղն, ինչպես Alt+F5"
# navigator/settings.py
"Hide the command line, and type nothing on it" = "Թաքցնել հրամանի տողը, և ոչինչ չգրել դրանում"
# navigator/settings.py
"Hide the command line while it is empty" = "Թաքցնել հրամանի տողը, մինչ այն դատարկ է"
# navigator/settings.py
"Block cursor on the command line" = "Բլոկային կուրսոր հրամանի տողում"
# navigator/settings.py
"Open a new editor where the last one was" = "Բացել նոր խմբագրիչը այնտեղ, որտեղ վերջինն էր"
# navigator/settings.py
"Reopen a tracked file in the viewer at its window, scroll and cursor" = "Վերաբացել հետևվող ֆայլը դիտիչում իր պատուհանով, ոլորմամբ և կուրսորով"
# navigator/settings.py
"Track editing history: Alt+PgUp, modes restored" = "Խմբագրման պատմություն՝ Alt+PgUp, ռեժիմները վերականգնվում են"
# navigator/settings.py
"Track viewing history: Alt+PgDn, modes restored" = "Դիտման պատմություն՝ Alt+PgDn, ռեժիմները վերականգնվում են"
# navigator/settings.py
"Track directories: Alt+Backspace lists where the panels have been" = "Հետևել թղթապանակներին՝ Alt+Backspace-ը ցուցակում է, որտեղ են եղել վահանակները"
# navigator/settings.py
"Tell zoxide every directory a panel comes to, where zoxide is installed" = "Տեղեկացնել zoxide-ին ամեն թղթապանակ, ուր գալիս է վահանակը, եթե zoxide-ը տեղադրված է"
# navigator/settings.py
"Entries kept per history list: input lines, viewed and edited files" = "Գրառումներ, պահված յուրաքանչյուր պատմության ցանկում՝ մուտքի տողեր, դիտված և խմբագրված ֆայլեր"
# navigator/settings.py
"The language captions and messages are in: a catalogue's code (en, lv, ...), or empty to follow $LANG" = "Լեզուն, որով են պիտակներն ու հաղորդագրությունները՝ կատալոգի կոդ (en, lv, ...), կամ դատարկ՝ $LANG-ին հետևելու համար"
# navigator/settings.py
"Which way the screen reads: auto (as the language's catalogue says), ltr (left to right) or rtl (right to left, mirrored)" = "Որ ուղղությամբ է կարդացվում էկրանը՝ auto (ինչպես ասում է լեզվի կատալոգը), ltr (ձախից աջ) կամ rtl (աջից ձախ, հայելային)"
# navigator/settings.py
"Where Options > Settings shows its tabs: a row on top, a column on the left, or simple, a plain row of captions on top" = "Որտեղ է Ընտրանքներ > Կարգավորումները ցույց տալիս ներդիրները՝ վերևում տող, ձախում սյունակ, կամ simple, վերևում պարզ պիտակների տող"
# navigator/settings.py
"The windows listed on the menu bar, Win+1 .. Win+9's numbers: off, numbers alone, or numbers and titles" = "Մենյուի գոտում ցուցակված պատուհանները, Win+1 .. Win+9 համարները՝ off, միայն համարներ, կամ համարներ և վերնագրեր"
# navigator/settings.py
"Milliseconds the mouse pointer rests on something before its tooltip shows, 0 for none" = "Միլիվայրկյաններ, որ մկնիկի ցուցիչը կանգնում է մինչև հուշման հայտնվելը, 0՝ ոչ մի"
# navigator/settings.py
"Ask before erasing a single file" = "Հարցնել մեկ ֆայլ ջնջելուց առաջ"
# navigator/settings.py
"Ask before erasing several files" = "Հարցնել մի քանի ֆայլ ջնջելուց առաջ"
# navigator/settings.py
"Ask before erasing a non-empty directory" = "Հարցնել ոչ դատարկ թղթապանակ ջնջելուց առաջ"
# navigator/settings.py
"Ask before erasing a read-only file" = "Հարցնել միայն ընթերցվող ֆայլ ջնջելուց առաջ"
# navigator/settings.py
"Ask before creating a missing target directory" = "Հարցնել բացակա նպատակային թղթապանակ ստեղծելուց առաջ"
# navigator/settings.py
"The Copy dialog before files dropped with the mouse are copied" = "Պատճենման երկխոսություն մկնիկով գցված ֆայլերը պատճենելուց առաջ"
# navigator/settings.py
"Ask before quitting Navigator" = "Հարցնել Navigator-ից դուրս գալուց առաջ"
# navigator/settings.py
"Ask before the editor's F2 (Ctrl+S) saves a file" = "Հարցնել, նախքան խմբագրիչի F2-ը (Ctrl+S) կպահի ֆայլը"
# navigator/settings.py
