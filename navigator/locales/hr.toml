"Sync each file to disk as it is copied" = "Sinkroniziraj svaku datoteku na disk dok se kopira"
# navigator/settings.py
"Ctrl+O shows the console inside Navigator; off hands the real terminal to the shell, as mc does" = "Ctrl+O prikazuje konzolu unutar Navigatora; isključeno predaje pravi terminal ljusci, kao mc"
# navigator/settings.py
"Temporary directory; empty means $TMPDIR" = "Privremena mapa; prazno znači $TMPDIR"
# navigator/settings.py
"An unexpected error shows a box with its traceback, or quits printing it" = "Neočekivana pogreška prikazuje okvir s ispisom, ili izlazi i ispisuje ga"
# navigator/settings.py
"Seconds Navigator may stop responding before errors.log records why; 0 never" = "Sekunde koliko Navigator smije ne odgovarati prije nego errors.log zapiše zašto; 0 nikad"
# navigator/settings.py
"A step refused permission may be done again as root through sudo or pkexec; auto is sudo, else pkexec" = "Korak kojem je uskraćeno dopuštenje smije se ponoviti kao root preko sudo ili pkexec; auto je sudo, inače pkexec"
# navigator/settings.py
"Minutes root access stays open after its last use; 0 closes it after each operation" = "Minute koliko root pristup ostaje otvoren nakon zadnje upotrebe; 0 ga zatvara nakon svakog postupka"
# navigator/settings.py
"The desktop's plumbing for volumes, links and opening files: GIO, KIO, or off; auto is KIO under KDE, else GIO" = "Infrastruktura radne površine za volumene, veze i otvaranje datoteka: GIO, KIO, ili isključeno; auto je KIO pod KDE-om, inače GIO"
# navigator/settings.py
"When a long operation ends while the terminal is in the background, tell the desktop: through the terminal (OSC 9/777), notify-send, or off; auto picks what this terminal shows" = "Kad dugi postupak završi dok je terminal u pozadini, obavijesti radnu površinu: preko terminala (OSC 9/777), notify-send, ili isključeno; auto bira što ovaj terminal prikazuje"
# navigator/settings.py
"Auto run the User Menu" = "Automatski pokreni korisnički izbornik"
