"Which way the screen reads: auto (as the language's catalogue says), ltr (left to right) or rtl (right to left, mirrored)" = "Kojim se smjerom zaslon čita: auto (kako kaže katalog jezika), ltr (slijeva nadesno) ili rtl (zdesna nalijevo, zrcaljeno)"
# navigator/settings.py
"Where Options > Settings shows its tabs: a row on top, a column on the left, or simple, a plain row of captions on top" = "Gdje Mogućnosti > Postavke prikazuju kartice: redak gore, stupac lijevo, ili simple, običan redak natpisa gore"
