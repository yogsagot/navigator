"Colour scheme, one of `nav --list-themes`" = "Schema di colori, uno di `nav --list-themes`"
# navigator/settings.py
"What a colour name means: DN's VGA value, or the terminal's own scheme" = "Cosa significa il nome di un colore: il valore VGA di DN, o lo schema del terminale"
# navigator/settings.py
"How many colours the terminal shows; auto reads COLORTERM and TERM" = "Quanti colori mostra il terminale; auto legge COLORTERM e TERM"
# navigator/settings.py
"Which characters the terminal's font draws" = "Quali caratteri disegna il font del terminale"
# navigator/settings.py
"How check boxes and radio buttons are drawn: dos [X] (•), brackets [✓] (●), boxes without brackets" = "Come si disegnano caselle e pulsanti di opzione: dos [X] (•), brackets [✓] (●), boxes senza parentesi"
# navigator/settings.py
"Paint what lies behind a dialog faint" = "Attenua ciò che sta dietro un dialogo"
# navigator/settings.py
"F4 opens the internal editor; off runs $EDITOR" = "F4 apre l'editor interno; se spento esegue $EDITOR"
# navigator/settings.py
"F3 opens the internal viewer; off runs $PAGER" = "F3 apre il visore interno; se spento esegue $PAGER"
# navigator/settings.py
"Copy to and paste from the desktop's clipboard; off, Navigator's own" = "Copia e incolla con gli appunti del desktop; se spento, con quelli di Navigator"
# navigator/settings.py
"A new panel shows hidden files (Ctrl+H toggles one)" = "Un nuovo pannello mostra i file nascosti (Ctrl+H lo alterna)"
# navigator/settings.py
"Sync each file to disk as it is copied" = "Scrive su disco ogni file appena copiato"
# navigator/settings.py
"Ctrl+O shows the console inside Navigator; off hands the real terminal to the shell, as mc does" = "Ctrl+O mostra la console dentro Navigator; se spento passa il terminale reale alla shell, come mc"
# navigator/settings.py
"Temporary directory; empty means $TMPDIR" = "Directory temporanea; vuoto significa $TMPDIR"
# navigator/settings.py
"An unexpected error shows a box with its traceback, or quits printing it" = "Un errore imprevisto mostra una finestra col traceback, o esce stampandolo"
# navigator/settings.py
"Seconds Navigator may stop responding before errors.log records why; 0 never" = "Secondi in cui Navigator può non rispondere prima che errors.log ne registri il motivo; 0 mai"
# navigator/settings.py
"A step refused permission may be done again as root through sudo or pkexec; auto is sudo, else pkexec" = "Un'operazione negata per permessi può essere rifatta come root tramite sudo o pkexec; auto è sudo, altrimenti pkexec"
# navigator/settings.py
"Minutes root access stays open after its last use; 0 closes it after each operation" = "Minuti per cui l'accesso root resta aperto dopo l'ultimo uso; 0 lo chiude dopo ogni operazione"
# navigator/settings.py
"The desktop's plumbing for volumes, links and opening files: GIO, KIO, or off; auto is KIO under KDE, else GIO" = "Il meccanismo del desktop per volumi, collegamenti e apertura file: GIO, KIO o spento; auto è KIO sotto KDE, altrimenti GIO"
# navigator/settings.py
"When a long operation ends while the terminal is in the background, tell the desktop: through the terminal (OSC 9/777), notify-send, or off; auto picks what this terminal shows" = "Quando un'operazione lunga finisce col terminale in background, avvisa il desktop: tramite il terminale (OSC 9/777), notify-send o spento; auto sceglie ciò che questo terminale mostra"
# navigator/settings.py
"Auto run the User Menu" = "Esegue automaticamente il menu utente"
# navigator/settings.py
"Clear the unpinned history entries on startup" = "Cancella all'avvio le voci di cronologia non fissate"
# navigator/settings.py
"Exit after an hour of inactivity" = "Esce dopo un'ora di inattività"
# navigator/settings.py
"Save the desktop on exit and restore it at the next start" = "Salva il desktop all'uscita e lo ripristina all'avvio successivo"
# navigator/settings.py
"The active panel keeps its directory after a command and in a restored desktop" = "Il pannello attivo mantiene la directory dopo un comando e in un desktop ripristinato"
# navigator/settings.py
"Show the clock at the menu bar's right end" = "Mostra l'orologio all'estremità destra della barra dei menu"
# navigator/settings.py
"Hide the menu bar until F10" = "Nasconde la barra dei menu fino a F10"
# navigator/settings.py
"Hide the key bar" = "Nasconde la barra dei tasti"
# navigator/settings.py
"Esc on an empty command line shows the user screen until a key, as Alt+F5" = "Esc su una riga di comando vuota mostra lo schermo utente fino a un tasto, come Alt+F5"
# navigator/settings.py
"Hide the command line, and type nothing on it" = "Nasconde la riga di comando e non vi scrive nulla"
# navigator/settings.py
"Hide the command line while it is empty" = "Nasconde la riga di comando finché è vuota"
# navigator/settings.py
"Block cursor on the command line" = "Cursore a blocco sulla riga di comando"
# navigator/settings.py
"Open a new editor where the last one was" = "Apre un nuovo editor dove era l'ultimo"
# navigator/settings.py
"Reopen a tracked file in the viewer at its window, scroll and cursor" = "Riapre un file tracciato nel visore con la sua finestra, scorrimento e cursore"
# navigator/settings.py
"Track editing history: Alt+PgUp, modes restored" = "Cronologia file modificati: Alt+PgUp, modi ripristinati"
# navigator/settings.py
"Track viewing history: Alt+PgDn, modes restored" = "Cronologia file visti: Alt+PgDn, modi ripristinati"
# navigator/settings.py
"Track directories: Alt+Backspace lists where the panels have been" = "Cronologia directory: Alt+Backspace elenca dove sono stati i pannelli"
# navigator/settings.py
"Tell zoxide every directory a panel comes to, where zoxide is installed" = "Comunica a zoxide ogni directory in cui arriva un pannello, se zoxide è installato"
# navigator/settings.py
"Entries kept per history list: input lines, viewed and edited files" = "Voci conservate per ogni cronologia: righe di input, file visti e modificati"
# navigator/settings.py
"The language captions and messages are in: a catalogue's code (en, lv, ...), or empty to follow $LANG" = "La lingua di etichette e messaggi: il codice di un catalogo (en, lv, ...), o vuoto per seguire $LANG"
# navigator/settings.py
"Which way the screen reads: auto (as the language's catalogue says), ltr (left to right) or rtl (right to left, mirrored)" = "Il verso di lettura dello schermo: auto (come dice il catalogo della lingua), ltr (da sinistra a destra) o rtl (da destra a sinistra, speculare)"
# navigator/settings.py
"Where Options > Settings shows its tabs: a row on top, a column on the left, or simple, a plain row of captions on top" = "Dove Opzioni > Impostazioni mostra le schede: una riga in alto, una colonna a sinistra, o simple, una semplice riga di titoli in alto"
# navigator/settings.py
"The windows listed on the menu bar, Win+1 .. Win+9's numbers: off, numbers alone, or numbers and titles" = "Le finestre elencate nella barra dei menu, i numeri di Win+1 .. Win+9: spento, solo numeri, o numeri e titoli"
# navigator/settings.py
"Milliseconds the mouse pointer rests on something before its tooltip shows, 0 for none" = "Millisecondi di sosta del puntatore prima che compaia il suggerimento, 0 per nessuno"
# navigator/settings.py
"Ask before erasing a single file" = "Chiede prima di eliminare un singolo file"
# navigator/settings.py
