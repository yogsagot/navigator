"Colour scheme, one of `nav --list-themes`" = "رنگ اسکیم، `nav --list-themes` میں سے ایک"
# navigator/settings.py
"What a colour name means: DN's VGA value, or the terminal's own scheme" = "رنگ کے نام کا مطلب: DN کی VGA قدر، یا ٹرمینل کی اپنی اسکیم"
# navigator/settings.py
"How many colours the terminal shows; auto reads COLORTERM and TERM" = "ٹرمینل کتنے رنگ دکھاتا ہے؛ auto COLORTERM اور TERM پڑھتا ہے"
# navigator/settings.py
"Which characters the terminal's font draws" = "ٹرمینل کا فونٹ کون سے حروف بناتا ہے"
# navigator/settings.py
"How check boxes and radio buttons are drawn: dos [X] (•), brackets [✓] (●), boxes without brackets" = "چیک باکس اور ریڈیو بٹن کیسے بنیں: dos [X] (•)، brackets [✓] (●)، boxes بغیر قوسین"
# navigator/settings.py
"Paint what lies behind a dialog faint" = "مکالمے کے پیچھے والی چیز مدھم بنائیں"
# navigator/settings.py
"F4 opens the internal editor; off runs $EDITOR" = "F4 اندرونی ایڈیٹر کھولتا ہے؛ بند ہو تو $EDITOR چلتا ہے"
# navigator/settings.py
"F3 opens the internal viewer; off runs $PAGER" = "F3 اندرونی ناظر کھولتا ہے؛ بند ہو تو $PAGER چلتا ہے"
# navigator/settings.py
"Copy to and paste from the desktop's clipboard; off, Navigator's own" = "ڈیسک ٹاپ کے کلپ بورڈ سے نقل اور چسپاں؛ بند ہو تو Navigator کا اپنا"
# navigator/settings.py
"A new panel shows hidden files (Ctrl+H toggles one)" = "نیا پینل چھپی فائلیں دکھاتا ہے (Ctrl+H ایک کا بدلتا ہے)"
# navigator/settings.py
"Sync each file to disk as it is copied" = "ہر فائل نقل ہوتے ہی ڈسک سے ہم آہنگ کریں"
# navigator/settings.py
"Ctrl+O shows the console inside Navigator; off hands the real terminal to the shell, as mc does" = "Ctrl+O کنسول Navigator کے اندر دکھاتا ہے؛ بند ہو تو اصل ٹرمینل شیل کو دیتا ہے، جیسے mc"
# navigator/settings.py
"Temporary directory; empty means $TMPDIR" = "عارضی ڈائریکٹری؛ خالی یعنی $TMPDIR"
# navigator/settings.py
"An unexpected error shows a box with its traceback, or quits printing it" = "غیر متوقع غلطی ٹریس بیک کے ساتھ خانہ دکھاتی ہے، یا اسے چھاپ کر بند ہوتی ہے"
# navigator/settings.py
"Seconds Navigator may stop responding before errors.log records why; 0 never" = "وہ سیکنڈ جن میں Navigator جواب دینا روک سکتا ہے اس سے پہلے کہ errors.log وجہ درج کرے؛ 0 کبھی نہیں"
# navigator/settings.py
"A step refused permission may be done again as root through sudo or pkexec; auto is sudo, else pkexec" = "اجازت سے انکار والا قدم sudo یا pkexec سے بطور root دوبارہ ہو سکتا ہے؛ auto یعنی sudo، ورنہ pkexec"
# navigator/settings.py
"Minutes root access stays open after its last use; 0 closes it after each operation" = "آخری استعمال کے بعد root رسائی کتنے منٹ کھلی رہے؛ 0 ہر عمل کے بعد بند کرتا ہے"
# navigator/settings.py
"The desktop's plumbing for volumes, links and opening files: GIO, KIO, or off; auto is KIO under KDE, else GIO" = "والیوم، لنک اور فائلیں کھولنے کے لیے ڈیسک ٹاپ کا نظام: GIO، KIO، یا off؛ auto KDE میں KIO، ورنہ GIO"
# navigator/settings.py
"When a long operation ends while the terminal is in the background, tell the desktop: through the terminal (OSC 9/777), notify-send, or off; auto picks what this terminal shows" = "جب ٹرمینل پس منظر میں ہو اور لمبا عمل ختم ہو تو ڈیسک ٹاپ کو بتائیں: ٹرمینل کے ذریعے (OSC 9/777)، notify-send، یا off؛ auto وہ چنتا ہے جو یہ ٹرمینل دکھائے"
# navigator/settings.py
"Auto run the User Menu" = "صارف مینو خود چلائیں"
# navigator/settings.py
"Clear the unpinned history entries on startup" = "آغاز پر غیر پن شدہ تاریخچہ اندراجات صاف کریں"
# navigator/settings.py
"Exit after an hour of inactivity" = "ایک گھنٹہ بیکاری کے بعد بند"
# navigator/settings.py
"Save the desktop on exit and restore it at the next start" = "بند ہوتے وقت ڈیسک ٹاپ محفوظ کریں اور اگلے آغاز پر بحال کریں"
# navigator/settings.py
"The active panel keeps its directory after a command and in a restored desktop" = "فعال پینل کمانڈ کے بعد اور بحال ڈیسک ٹاپ میں اپنی ڈائریکٹری رکھتا ہے"
# navigator/settings.py
"Show the clock at the menu bar's right end" = "مینو بار کے دائیں سرے پر گھڑی دکھائیں"
# navigator/settings.py
"Hide the menu bar until F10" = "F10 تک مینو بار چھپائیں"
# navigator/settings.py
"Hide the key bar" = "کلیدی پٹی چھپائیں"
# navigator/settings.py
"Esc on an empty command line shows the user screen until a key, as Alt+F5" = "خالی کمانڈ لائن پر Esc کلید دبانے تک صارف اسکرین دکھاتا ہے، جیسے Alt+F5"
# navigator/settings.py
"Hide the command line, and type nothing on it" = "کمانڈ لائن چھپائیں، اور اس پر کچھ نہ لکھیں"
# navigator/settings.py
"Hide the command line while it is empty" = "خالی ہونے تک کمانڈ لائن چھپائیں"
# navigator/settings.py
"Block cursor on the command line" = "کمانڈ لائن پر بلاک کرسر"
# navigator/settings.py
"Open a new editor where the last one was" = "نیا ایڈیٹر وہیں کھولیں جہاں پچھلا تھا"
# navigator/settings.py
"Reopen a tracked file in the viewer at its window, scroll and cursor" = "ریکارڈ شدہ فائل ناظر میں اس کی ونڈو، اسکرول اور کرسر پر دوبارہ کھولیں"
# navigator/settings.py
