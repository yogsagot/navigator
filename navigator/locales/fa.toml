"Decoding asks before writing over a file" = "رمزگشایی پیش از بازنویسی فایل می‌پرسد"
# navigator/settings.py
"Decoding shows each error as it finds it" = "رمزگشایی هر خطا را همان وقت که بیابد نشان می‌دهد"
# navigator/settings.py
"Decoding keeps a file it could not decode whole" = "رمزگشایی فایلی را که نتوانست کامل رمزگشایی کند نگه می‌دارد"
# navigator/settings.py
"The size of each part: 100M, 1.44M, 4G or bytes" = "اندازه هر بخش: 100M، 1.44M، 4G یا بایت"
# navigator/settings.py
"Split writes the set's NAME.crc, which Combine checks" = "تقسیم NAME.crc ِ مجموعه را می‌نویسد، که یکی کردن بررسی‌اش می‌کند"
# navigator/settings.py
"Write each file's directory with its name" = "پوشه هر فایل با نامش نوشته شود"
# navigator/settings.py
"Write the directory only where it is not the list's own" = "پوشه فقط وقتی نوشته شود که مال خود فهرست نیست"
# navigator/settings.py
"The digest Calculate writes" = "چکیده‌ای که محاسبه می‌نویسد"
# navigator/settings.py
"One list for all the files, or one beside each file" = "یک فهرست برای همه فایل‌ها، یا یکی کنار هر فایل"
# navigator/settings.py
"The encoding the files are written in, or keep each file's" = "کدگذاری‌ای که فایل‌ها با آن نوشته می‌شوند، یا نگه‌داشتن مال هر فایل"
# navigator/settings.py
"The line endings the files get, or keep each line's" = "پایان خط‌هایی که فایل‌ها می‌گیرند، یا نگه‌داشتن مال هر خط"
# navigator/settings.py
"What a file that is not UTF-8 is read as: utf-8 leaves it alone, or a code page" = "فایل غیر UTF-8 چگونه خوانده شود: utf-8 دست‌نخورده‌اش می‌گذارد، یا یک صفحه‌کد"
# navigator/settings.py
"A converted file keeps its modification time" = "فایل تبدیل‌شده زمان تغییرش را نگه می‌دارد"
# navigator/settings.py
"The program Encrypt runs" = "برنامه‌ای که رمزنگاری اجرا می‌کند"
# navigator/settings.py
"Encrypt to a passphrase, or to recipients' keys" = "رمزنگاری با عبارت رمز، یا با کلید گیرندگان"
# navigator/settings.py
"Encrypted files are ASCII text (gpg: .asc)" = "فایل‌های رمزشده متن ASCII هستند (gpg: .asc)"
# navigator/settings.py
"Encrypt removes each file once its encrypted copy is written" = "رمزنگاری هر فایل را پس از نوشته شدن کپی رمزشده‌اش حذف می‌کند"
# navigator/settings.py
"The last recipients: gpg key IDs, or age keys or files of them, by spaces" = "آخرین گیرندگان: شناسه‌های کلید gpg، یا کلیدهای age یا فایل‌هایشان، با فاصله"
# navigator/settings.py
"age identity files Decrypt tries, by spaces; empty: $XDG_CONFIG_HOME/age/keys.txt if it is there" = "فایل‌های هویت age که رمزگشایی امتحان می‌کند، با فاصله؛ خالی: $XDG_CONFIG_HOME/age/keys.txt اگر باشد"
# navigator/settings.py
"Which files and directories (ending in /) are compared; - before one leaves it out" = "کدام فایل‌ها و پوشه‌ها (پایان‌یافته با /) مقایسه شوند؛ - در آغاز کنار می‌گذارد"
# navigator/settings.py
"How far apart two times may be and be the same: exact, fat (2 s) or minute" = "دو زمان چقدر می‌توانند دور باشند و یکسان شمرده شوند: exact، fat (2 s) یا minute"
# navigator/settings.py
"Times exactly an hour apart are the same, as daylight saving leaves them" = "زمان‌هایی که دقیقاً یک ساعت فاصله دارند یکسان‌اند، همان‌گونه که ساعت تابستانی می‌گذاردشان"
# navigator/settings.py
"The right side becomes a copy of the left: what only it has is deleted" = "سمت راست کپی سمت چپ می‌شود: آنچه فقط خودش دارد حذف می‌شود"
# navigator/settings.py
"Seconds between reads of the process list while it is open; 0 reads only on Ctrl+R" = "ثانیه‌های میان خواندن‌های فهرست فرایندها وقتی باز است؛ 0 فقط با Ctrl+R می‌خواند"
# navigator/settings.py
"The service manager Services works: auto (the one running), systemd, openrc, runit or sysvinit" = "مدیر سرویسی که سرویس‌ها با آن کار می‌کند: auto (آنکه در حال اجراست)، systemd، openrc، runit یا sysvinit"
# navigator/settings.py
"Seconds between reads of the units while Services is open; 0 reads only on Ctrl+R" = "ثانیه‌های میان خواندن‌های واحدها وقتی سرویس‌ها باز است؛ 0 فقط با Ctrl+R می‌خواند"
# navigator/settings.py
"How many of a unit's last journal lines F3 shows before following it" = "F3 پیش از دنبال کردن چند خط آخر ژورنال یک واحد را نشان می‌دهد"
# navigator/settings.py
"Seconds between reads of the system monitor while it is open; 0 reads only on Ctrl+R" = "ثانیه‌های میان خواندن‌های پایشگر سیستم وقتی باز است؛ 0 فقط با Ctrl+R می‌خواند"
# navigator/settings.py
"Seconds between keep-alive messages to a server; 0 sends none" = "ثانیه‌های میان پیام‌های keep-alive به سرور؛ 0 هیچ نمی‌فرستد"
# navigator/settings.py
"Minutes a connection nothing uses stays open before it is closed; 0 keeps it" = "دقیقه‌هایی که اتصالی که چیزی به کارش نمی‌برد پیش از بسته شدن باز می‌ماند؛ 0 نگهش می‌دارد"
# navigator/settings.py
"A file from another drive that a program changed goes back: ask, always or never" = "فایلی از درایو دیگر که برنامه‌ای تغییرش داده برمی‌گردد: ask، always یا never"
# navigator/settings.py
"Seconds to wait for a server to answer when connecting" = "ثانیه‌های انتظار برای پاسخ سرور هنگام اتصال"
# navigator/settings.py
"Words added to every Remote shell's ssh command, before a connection's own" = "واژه‌هایی که به فرمان ssh هر پوسته دوردست افزوده می‌شوند، پیش از مال خود اتصال"
# navigator/settings.py
"Seconds between looks at a server's directory for Auto refresh; 0 never" = "ثانیه‌های میان نگاه‌ها به پوشه سرور برای تازه‌سازی خودکار؛ 0 هرگز"
