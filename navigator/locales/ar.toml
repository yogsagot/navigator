# navigator/settings.py
"Ctrl+O shows the console inside Navigator; off hands the real terminal to the shell, as mc does" = "Ctrl+O يعرض الطرفية داخل Navigator؛ عند الإيقاف يسلم الطرفية الحقيقية للصدفة كما يفعل mc"
# navigator/settings.py
"Temporary directory; empty means $TMPDIR" = "المجلد المؤقت؛ الفارغ يعني $TMPDIR"
