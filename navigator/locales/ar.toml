# navigator/settings.py
"Where Options > Settings shows its tabs: a row on top, a column on the left, or simple, a plain row of captions on top" = "أين تعرض الخيارات > الإعدادات ألسنتها: صف في الأعلى، أو عمود على اليسار، أو بسيط، صف تسميات عادي في الأعلى"
# navigator/settings.py
