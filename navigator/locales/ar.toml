"Minutes root access stays open after its last use; 0 closes it after each operation" = "الدقائق التي تبقى فيها صلاحية root مفتوحة بعد آخر استخدام؛ 0 يغلقها بعد كل عملية"
# navigator/settings.py
"The desktop's plumbing for volumes, links and opening files: GIO, KIO, or off; auto is KIO under KDE, else GIO" = "وسيلة سطح المكتب لوحدات التخزين والروابط وفتح الملفات: GIO أو KIO أو إيقاف؛ auto تعني KIO في KDE، وإلا GIO"
