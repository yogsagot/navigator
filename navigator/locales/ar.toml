"An unexpected error shows a box with its traceback, or quits printing it" = "الخطأ غير المتوقع يعرض مربعا بتتبعه، أو ينهي البرنامج طابعا إياه"
# navigator/settings.py
"Seconds Navigator may stop responding before errors.log records why; 0 never" = "الثواني التي قد يتوقف فيها Navigator عن الاستجابة قبل أن يسجل errors.log السبب؛ 0 أبدا"
# navigator/settings.py
"A step refused permission may be done again as root through sudo or pkexec; auto is sudo, else pkexec" = "الخطوة المرفوضة الصلاحية قد تعاد كـ root عبر sudo أو pkexec؛ auto تعني sudo، وإلا pkexec"
# navigator/settings.py
"Minutes root access stays open after its last use; 0 closes it after each operation" = "الدقائق التي تبقى فيها صلاحية root مفتوحة بعد آخر استخدام؛ 0 يغلقها بعد كل عملية"
# navigator/settings.py
"The desktop's plumbing for volumes, links and opening files: GIO, KIO, or off; auto is KIO under KDE, else GIO" = "وسيلة سطح المكتب لوحدات التخزين والروابط وفتح الملفات: GIO أو KIO أو إيقاف؛ auto تعني KIO في KDE، وإلا GIO"
# navigator/settings.py
