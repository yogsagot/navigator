"Colour scheme, one of `nav --list-themes`" = "Rang sxemasi, `nav --list-themes` dan biri"
# navigator/settings.py
"What a colour name means: DN's VGA value, or the terminal's own scheme" = "Rang nomining maʼnosi: DN ning VGA qiymati yoki terminalning oʻz sxemasi"
# navigator/settings.py
"How many colours the terminal shows; auto reads COLORTERM and TERM" = "Terminal nechta rang koʻrsatadi; auto COLORTERM va TERM ni oʻqiydi"
# navigator/settings.py
"Which characters the terminal's font draws" = "Terminal shrifti qaysi belgilarni chizadi"
# navigator/settings.py
"How check boxes and radio buttons are drawn: dos [X] (•), brackets [✓] (●), boxes without brackets" = "Belgilash qutilari va radio tugmalar qanday chiziladi: dos [X] (•), brackets [✓] (●), boxes qavssiz"
# navigator/settings.py
"Paint what lies behind a dialog faint" = "Dialog ortidagini xira chizish"
# navigator/settings.py
"F4 opens the internal editor; off runs $EDITOR" = "F4 ichki muharrirni ochadi; oʻchiq boʻlsa $EDITOR ishlaydi"
# navigator/settings.py
"F3 opens the internal viewer; off runs $PAGER" = "F3 ichki koʻruvchini ochadi; oʻchiq boʻlsa $PAGER ishlaydi"
# navigator/settings.py
"Copy to and paste from the desktop's clipboard; off, Navigator's own" = "Ish stoli almashinuv buferiga nusxalash va undan qoʻyish; oʻchiq boʻlsa, Navigator ning oʻziniki"
# navigator/settings.py
"A new panel shows hidden files (Ctrl+H toggles one)" = "Yangi panel yashirin fayllarni koʻrsatadi (Ctrl+H bittasinikini almashtiradi)"
# navigator/settings.py
"Sync each file to disk as it is copied" = "Har faylni nusxalanayotganda diskka sinxronlash"
# navigator/settings.py
"Ctrl+O shows the console inside Navigator; off hands the real terminal to the shell, as mc does" = "Ctrl+O konsolni Navigator ichida koʻrsatadi; oʻchiq boʻlsa, mc kabi, haqiqiy terminalni shellga beradi"
# navigator/settings.py
"Temporary directory; empty means $TMPDIR" = "Vaqtinchalik jild; boʻsh $TMPDIR degani"
# navigator/settings.py
"An unexpected error shows a box with its traceback, or quits printing it" = "Kutilmagan xato traceback li qutini koʻrsatadi yoki uni chop etib chiqadi"
# navigator/settings.py
"Seconds Navigator may stop responding before errors.log records why; 0 never" = "errors.log sababini yozishidan oldin Navigator javob bermasligi mumkin boʻlgan soniyalar; 0 hech qachon"
# navigator/settings.py
"A step refused permission may be done again as root through sudo or pkexec; auto is sudo, else pkexec" = "Ruxsat rad etilgan qadam sudo yoki pkexec orqali root sifatida takrorlanishi mumkin; auto sudo, aks holda pkexec"
# navigator/settings.py
"Minutes root access stays open after its last use; 0 closes it after each operation" = "Root kirishi oxirgi ishlatilgandan keyin ochiq qoladigan daqiqalar; 0 har amaldan keyin yopadi"
# navigator/settings.py
"The desktop's plumbing for volumes, links and opening files: GIO, KIO, or off; auto is KIO under KDE, else GIO" = "Hajmlar, havolalar va fayllarni ochish uchun ish stoli mexanizmi: GIO, KIO yoki off; auto KDE da KIO, aks holda GIO"
# navigator/settings.py
"When a long operation ends while the terminal is in the background, tell the desktop: through the terminal (OSC 9/777), notify-send, or off; auto picks what this terminal shows" = "Terminal fonda boʻlganda uzoq amal tugasa, ish stoliga xabar berish: terminal orqali (OSC 9/777), notify-send yoki off; auto bu terminal koʻrsatadiganini tanlaydi"
# navigator/settings.py
"Auto run the User Menu" = "Foydalanuvchi menyusini avto ochish"
# navigator/settings.py
"Clear the unpinned history entries on startup" = "Ishga tushishda mahkamlanmagan tarix yozuvlarini tozalash"
