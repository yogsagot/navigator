"The size of each part: 100M, 1.44M, 4G or bytes" = "Әр бөліктің өлшемі: 100M, 1.44M, 4G немесе байт"
# navigator/settings.py
"Split writes the set's NAME.crc, which Combine checks" = "Бөлу жиынның NAME.crc файлын жазады, Біріктіру оны тексереді"
# navigator/settings.py
"Write each file's directory with its name" = "Әр файлдың бумасын атымен жазу"
# navigator/settings.py
"Write the directory only where it is not the list's own" = "Буманы тек ол тізімнің өз бумасы болмаған жерде жазу"
# navigator/settings.py
"The digest Calculate writes" = "Есептеу жазатын хэш"
# navigator/settings.py
"One list for all the files, or one beside each file" = "Барлық файлға бір тізім немесе әр файлдың жанында бір"
# navigator/settings.py
"The encoding the files are written in, or keep each file's" = "Файлдар жазылатын кодтау немесе әр файлдікін сақтау"
# navigator/settings.py
"The line endings the files get, or keep each line's" = "Файлдар алатын жол соңдары немесе әр жолдікін сақтау"
# navigator/settings.py
"What a file that is not UTF-8 is read as: utf-8 leaves it alone, or a code page" = "UTF-8 емес файл қалай оқылады: utf-8 оған тиіспейді, немесе код беті"
# navigator/settings.py
"A converted file keeps its modification time" = "Түрлендірілген файл өзгертілген уақытын сақтайды"
# navigator/settings.py
"The program Encrypt runs" = "Шифрлау іске қосатын бағдарлама"
# navigator/settings.py
"Encrypt to a passphrase, or to recipients' keys" = "Құпия фразамен немесе алушылардың кілттерімен шифрлау"
# navigator/settings.py
"Encrypted files are ASCII text (gpg: .asc)" = "Шифрланған файлдар ASCII мәтін (gpg: .asc)"
# navigator/settings.py
"Encrypt removes each file once its encrypted copy is written" = "Шифрланған көшірмесі жазылған соң шифрлау әр файлды жояды"
# navigator/settings.py
"The last recipients: gpg key IDs, or age keys or files of them, by spaces" = "Соңғы алушылар: gpg кілт ID-лері немесе age кілттері не олардың файлдары, бос орынмен"
# navigator/settings.py
"age identity files Decrypt tries, by spaces; empty: $XDG_CONFIG_HOME/age/keys.txt if it is there" = "Шифр шешу сынайтын age сәйкестендіру файлдары, бос орынмен; бос: бар болса $XDG_CONFIG_HOME/age/keys.txt"
# navigator/settings.py
"Which files and directories (ending in /) are compared; - before one leaves it out" = "Қай файлдар мен бумалар (/ арқылы аяқталатын) салыстырылады; алдындағы - оны шығарады"
# navigator/settings.py
"How far apart two times may be and be the same: exact, fat (2 s) or minute" = "Екі уақыт бірдей саналу үшін қаншалықты алыс болуы мүмкін: exact, fat (2 s) немесе minute"
# navigator/settings.py
"Times exactly an hour apart are the same, as daylight saving leaves them" = "Дәл бір сағат айырмасы бар уақыттар бірдей, жазғы уақыт қалдырғандай"
# navigator/settings.py
"The right side becomes a copy of the left: what only it has is deleted" = "Оң жақ солдың көшірмесіне айналады: тек онда барлары жойылады"
# navigator/settings.py
"Seconds between reads of the process list while it is open; 0 reads only on Ctrl+R" = "Процестер тізімі ашық кезде оқулар арасындағы секундтар; 0 тек Ctrl+R бойынша оқиды"
# navigator/settings.py
"The service manager Services works: auto (the one running), systemd, openrc, runit or sysvinit" = "Қызметтер жұмыс істейтін қызметтер басқарушысы: auto (жұмыс істеп тұрғаны), systemd, openrc, runit немесе sysvinit"
# navigator/settings.py
"Seconds between reads of the units while Services is open; 0 reads only on Ctrl+R" = "Қызметтер ашық кезде бірліктерді оқулар арасындағы секундтар; 0 тек Ctrl+R бойынша оқиды"
# navigator/settings.py
"How many of a unit's last journal lines F3 shows before following it" = "Бақылаудан бұрын F3 бірліктің соңғы журнал жолдарының нешеуін көрсетеді"
# navigator/settings.py
"Seconds between reads of the system monitor while it is open; 0 reads only on Ctrl+R" = "Жүйе мониторы ашық кезде оқулар арасындағы секундтар; 0 тек Ctrl+R бойынша оқиды"
# navigator/settings.py
"Seconds between keep-alive messages to a server; 0 sends none" = "Серверге keep-alive хабарлары арасындағы секундтар; 0 ешқайсысын жібермейді"
# navigator/settings.py
"Minutes a connection nothing uses stays open before it is closed; 0 keeps it" = "Ешнәрсе қолданбайтын байланыс жабылғанша ашық тұратын минуттар; 0 сақтайды"
# navigator/settings.py
"A file from another drive that a program changed goes back: ask, always or never" = "Бағдарлама өзгерткен басқа дискідегі файл қайтады: ask, always немесе never"
# navigator/settings.py
"Seconds to wait for a server to answer when connecting" = "Қосылғанда сервер жауабын күту секундтары"
# navigator/settings.py
"Words added to every Remote shell's ssh command, before a connection's own" = "Әр Қашықтағы shell ssh пәрменіне, байланыстың өзінікінен бұрын қосылатын сөздер"
# navigator/settings.py
"Seconds between looks at a server's directory for Auto refresh; 0 never" = "Авто жаңарту үшін сервер бумасына қараулар арасындағы секундтар; 0 ешқашан"
