"Write each file's directory with its name" = "Запісваць тэчку кожнага файла з яго імем"
# navigator/settings.py
"Write the directory only where it is not the list's own" = "Запісваць тэчку толькі там, дзе яна не тэчка самога спіса"
# navigator/settings.py
"The digest Calculate writes" = "Хэш, што запісвае Падлічыць"
# navigator/settings.py
"One list for all the files, or one beside each file" = "Адзін спіс для ўсіх файлаў, або адзін побач з кожным"
# navigator/settings.py
"The encoding the files are written in, or keep each file's" = "Кадзіроўка, у якой запісваюцца файлы, або захаваць кадзіроўку кожнага"
# navigator/settings.py
"The line endings the files get, or keep each line's" = "Канцы радкоў, якія атрымліваюць файлы, або захаваць канцы кожнага радка"
# navigator/settings.py
"What a file that is not UTF-8 is read as: utf-8 leaves it alone, or a code page" = "Як чытаецца файл не ў UTF-8: utf-8 пакідае яго, або кодавая старонка"
# navigator/settings.py
"A converted file keeps its modification time" = "Пераўтвораны файл захоўвае час змены"
# navigator/settings.py
"The program Encrypt runs" = "Праграма, якую запускае Зашыфраваць"
# navigator/settings.py
"Encrypt to a passphrase, or to recipients' keys" = "Шыфраваць парольнай фразай або ключамі атрымальнікаў"
# navigator/settings.py
"Encrypted files are ASCII text (gpg: .asc)" = "Зашыфраваныя файлы — тэкст ASCII (gpg: .asc)"
# navigator/settings.py
"Encrypt removes each file once its encrypted copy is written" = "Зашыфраваць выдаляе кожны файл, калі запісана яго зашыфраваная копія"
# navigator/settings.py
"The last recipients: gpg key IDs, or age keys or files of them, by spaces" = "Апошнія атрымальнікі: ID ключоў gpg, або ключы age ці іх файлы, праз прабелы"
# navigator/settings.py
"age identity files Decrypt tries, by spaces; empty: $XDG_CONFIG_HOME/age/keys.txt if it is there" = "Файлы ідэнтычнасці age, якія спрабуе Расшыфраваць, праз прабелы; пуста: $XDG_CONFIG_HOME/age/keys.txt, калі ёсць"
# navigator/settings.py
"Which files and directories (ending in /) are compared; - before one leaves it out" = "Якія файлы і тэчкі (з / у канцы) параўноўваюцца; - перад адным выключае яго"
# navigator/settings.py
"How far apart two times may be and be the same: exact, fat (2 s) or minute" = "Наколькі далёкія могуць быць два часы і лічыцца аднолькавымі: exact, fat (2 s) або minute"
# navigator/settings.py
"Times exactly an hour apart are the same, as daylight saving leaves them" = "Час, што адрозніваецца роўна на гадзіну, аднолькавы, як яго пакідае летні час"
# navigator/settings.py
"The right side becomes a copy of the left: what only it has is deleted" = "Правы бок становіцца копіяй левага: тое, што ёсць толькі ў ім, выдаляецца"
# navigator/settings.py
"Seconds between reads of the process list while it is open; 0 reads only on Ctrl+R" = "Секунды паміж чытаннямі спіса працэсаў, пакуль ён адкрыты; 0 — толькі па Ctrl+R"
# navigator/settings.py
"The service manager Services works: auto (the one running), systemd, openrc, runit or sysvinit" = "Кіраўнік сэрвісаў, з якім працуюць Сэрвісы: auto (той, што працуе), systemd, openrc, runit або sysvinit"
# navigator/settings.py
"Seconds between reads of the units while Services is open; 0 reads only on Ctrl+R" = "Секунды паміж чытаннямі адзінак, пакуль Сэрвісы адкрыты; 0 — толькі па Ctrl+R"
# navigator/settings.py
"How many of a unit's last journal lines F3 shows before following it" = "Колькі апошніх радкоў журнала адзінкі паказвае F3, перш чым сачыць"
# navigator/settings.py
"Seconds between reads of the system monitor while it is open; 0 reads only on Ctrl+R" = "Секунды паміж чытаннямі манітора сістэмы, пакуль ён адкрыты; 0 — толькі па Ctrl+R"
# navigator/settings.py
"Seconds between keep-alive messages to a server; 0 sends none" = "Секунды паміж паведамленнямі keep-alive серверу; 0 — не адпраўляць"
# navigator/settings.py
"Minutes a connection nothing uses stays open before it is closed; 0 keeps it" = "Хвіліны, колькі злучэнне без ужывання застаецца адкрытым, перш чым закрыецца; 0 — трымаць"
# navigator/settings.py
"A file from another drive that a program changed goes back: ask, always or never" = "Файл з іншага дыска, зменены праграмай, вяртаецца: ask, always або never"
# navigator/settings.py
"Seconds to wait for a server to answer when connecting" = "Секунды чакання адказу сервера пры злучэнні"
# navigator/settings.py
"Words added to every Remote shell's ssh command, before a connection's own" = "Словы, што дадаюцца да кожнай каманды ssh аддаленай абалонкі, перад параметрамі злучэння"
# navigator/settings.py
"Seconds between looks at a server's directory for Auto refresh; 0 never" = "Секунды паміж праверкамі тэчкі сервера для аўтаабнаўлення; 0 — ніколі"
