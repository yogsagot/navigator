# navigator/settings.py
"Seconds Navigator may stop responding before errors.log records why; 0 never" = "Sekunder Navigator kan slutte å svare før errors.log noterer hvorfor; 0 aldri"
# navigator/settings.py
"A step refused permission may be done again as root through sudo or pkexec; auto is sudo, else pkexec" = "Et trinn som ble nektet tilgang kan gjøres på nytt som root via sudo eller pkexec; auto er sudo, ellers pkexec"
# navigator/settings.py
"Minutes root access stays open after its last use; 0 closes it after each operation" = "Minutter root-tilgangen forblir åpen etter siste bruk; 0 lukker den etter hver handling"
# navigator/settings.py
"The desktop's plumbing for volumes, links and opening files: GIO, KIO, or off; auto is KIO under KDE, else GIO" = "Skrivebordets rørlegging for volumer, lenker og åpning av filer: GIO, KIO, eller av; auto er KIO under KDE, ellers GIO"
# navigator/settings.py
"When a long operation ends while the terminal is in the background, tell the desktop: through the terminal (OSC 9/777), notify-send, or off; auto picks what this terminal shows" = "Når en lang handling slutter mens terminalen er i bakgrunnen, gi skrivebordet beskjed: via terminalen (OSC 9/777), notify-send, eller av; auto velger det denne terminalen viser"
# navigator/settings.py
"Auto run the User Menu" = "Kjør brukermenyen automatisk"
