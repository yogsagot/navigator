"Minutes root access stays open after its last use; 0 closes it after each operation" = "Minuter root-åtkomsten förblir öppen efter senaste användning; 0 stänger den efter varje åtgärd"
# navigator/settings.py
"The desktop's plumbing for volumes, links and opening files: GIO, KIO, or off; auto is KIO under KDE, else GIO" = "Skrivbordets rörledningar för volymer, länkar och att öppna filer: GIO, KIO, eller av; auto är KIO under KDE, annars GIO"
# navigator/settings.py
"When a long operation ends while the terminal is in the background, tell the desktop: through the terminal (OSC 9/777), notify-send, or off; auto picks what this terminal shows" = "När en lång åtgärd slutar medan terminalen är i bakgrunden, berätta för skrivbordet: via terminalen (OSC 9/777), notify-send, eller av; auto väljer det den här terminalen visar"
