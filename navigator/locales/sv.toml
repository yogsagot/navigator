# navigator/settings.py
"Where Options > Settings shows its tabs: a row on top, a column on the left, or simple, a plain row of captions on top" = "Var Alternativ > Inställningar visar sina flikar: en rad överst, en kolumn till vänster, eller simple, en enkel rad bildtexter överst"
# navigator/settings.py
"The windows listed on the menu bar, Win+1 .. Win+9's numbers: off, numbers alone, or numbers and titles" = "Fönstren listade på menyraden, Win+1 .. Win+9:s nummer: av, bara nummer, eller nummer och titlar"
# navigator/settings.py
