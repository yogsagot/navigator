# navigator/settings.py
"Temporary directory; empty means $TMPDIR" = "Temporär katalog; tom betyder $TMPDIR"
# navigator/settings.py
"An unexpected error shows a box with its traceback, or quits printing it" = "Ett oväntat fel visar en ruta med dess traceback, eller avslutar och skriver ut den"
# navigator/settings.py
"Seconds Navigator may stop responding before errors.log records why; 0 never" = "Sekunder Navigator får sluta svara innan errors.log noterar varför; 0 aldrig"
# navigator/settings.py
"A step refused permission may be done again as root through sudo or pkexec; auto is sudo, else pkexec" = "Ett steg som nekats behörighet får göras om som root via sudo eller pkexec; auto är sudo, annars pkexec"
